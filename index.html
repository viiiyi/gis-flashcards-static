<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GIS 抽认卡 · 静态版</title>
<style>
:root{--blue:#4358ff;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--ink:#2f2f2f;--text:#1f2937;--muted:#8f95a3;--line:#dde2ee;--panel:rgba(255,255,255,.84);--nav-height:78px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 88% 36%,rgba(202,255,205,.9),transparent 34%),radial-gradient(circle at 24% 72%,rgba(225,230,255,.95),transparent 36%),linear-gradient(180deg,#fff,#f7fbff);color:var(--text)}
button{appearance:none;border:0;background:none;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .22s var(--ease),box-shadow .22s,background .22s}button:active{transform:scale(.975)}
.app{width:min(1128px,100%);min-height:100svh;margin:0 auto;padding:28px 24px calc(var(--nav-height) + 26px)}.screen{display:none}.screen.active{display:block;animation:in .32s var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
.page-title{margin:8px 2px;font-size:clamp(30px,5vw,54px);letter-spacing:-.04em}.page-subtitle{margin:0 2px 24px;color:var(--muted);font-weight:800}
.list{display:grid;gap:16px}.chapter-card{width:100%;min-height:118px;padding:22px;border-radius:28px;background:var(--panel);border:1px solid rgba(217,223,238,.86);box-shadow:0 18px 48px rgba(50,55,80,.08);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;text-align:left}.chapter-name{display:block;margin-bottom:9px;font-size:clamp(22px,3.4vw,34px);font-weight:900;letter-spacing:-.03em}.chapter-meta{color:var(--muted);font-weight:800}.chapter-arrow{width:50px;height:50px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-size:28px;font-weight:900}
.header{display:flex;align-items:center;gap:14px;margin-bottom:12px}.back{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue);font-size:28px;font-weight:900}.title{color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{position:relative;width:100%;height:min(68svh,700px);min-height:430px;cursor:pointer;border-radius:38px;background:var(--ink);box-shadow:0 28px 80px rgba(50,55,80,.12);overflow:hidden;transition:background .24s var(--ease),transform .24s var(--ease)}.card.answer-side{background:#f9fafc;border:1px solid rgba(210,214,226,.9)}.top{display:flex;justify-content:space-between;padding:32px 40px 0;color:var(--muted);font-weight:900;font-size:clamp(18px,2vw,28px)}.content{flex:1;display:grid;place-items:center;padding:56px 40px 78px}.q,.a{width:100%;max-width:960px;margin:0;text-align:left;font-weight:900;line-height:1.52;letter-spacing:-.035em;word-break:break-word}.q{color:white;font-size:clamp(32px,5vw,62px)}.a{color:#2d3038;font-size:clamp(28px,4vw,50px)}.hint{position:absolute;left:0;right:0;bottom:28px;text-align:center;color:var(--muted);font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px}.pill,.action{min-height:68px;border-radius:23px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:22px;font-weight:900;box-shadow:0 12px 30px rgba(60,69,110,.06)}.wrong{color:var(--red)}.right{color:var(--green)}.action{color:white;border:0}.next{background:var(--green)}.fav{background:var(--yellow);color:#5f4500}.hidden{display:none!important}.one{grid-template-columns:1fr}
.progress{height:4px;margin-top:16px;background:rgba(67,88,255,.1);border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4358ff,#78a0ff);width:0%;transition:width .24s}
.exercise-card{padding:clamp(20px,4vw,34px);border-radius:38px;background:var(--panel);border:1px solid rgba(217,223,238,.9);box-shadow:0 24px 70px rgba(50,55,80,.12);display:flex;flex-direction:column;gap:16px}.counter{color:var(--muted);font-weight:900}.exercise-q{margin:0;font-size:clamp(24px,4vw,42px);line-height:1.45;letter-spacing:-.035em}.options{display:grid;gap:12px}.option{width:100%;min-height:62px;padding:15px 18px;border-radius:22px;background:rgba(255,255,255,.86);border:1px solid var(--line);text-align:left;font-weight:850;line-height:1.45}.option.correct{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.42);color:#087333}.option.incorrect{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35);color:#b91c1c}.explain{display:none;padding:16px;border-radius:20px;background:rgba(67,88,255,.08);line-height:1.7;font-weight:750;color:#334155}.explain.active{display:block}
.favorites{display:grid;gap:14px}.fav-card{padding:16px;border-radius:20px;background:rgba(255,255,255,.86);border:1px solid var(--line)}.fav-card p{margin:0 0 8px;line-height:1.55}.fav-card strong{color:var(--text)}
.tabs{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;width:min(560px,calc(100% - 28px));height:var(--nav-height);transform:translateX(-50%);padding:8px;border-radius:28px;background:rgba(255,255,255,.88);border:1px solid rgba(217,223,238,.9);box-shadow:0 20px 60px rgba(50,55,80,.14);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{border-radius:22px;color:var(--muted);font-weight:900}.tab.active{background:var(--blue);color:white}
.empty{min-height:220px;border:1px dashed rgba(150,158,178,.7);border-radius:28px;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5);font-weight:800;line-height:1.7}
@media(max-width:760px){:root{--nav-height:72px}.app{padding:16px 14px calc(var(--nav-height) + 22px)}.card{height:62svh;min-height:370px}.face,.exercise-card{border-radius:28px}.top{padding:20px 22px 0}.content{padding:40px 22px 64px}.q{font-size:clamp(25px,8vw,40px)}.a{font-size:clamp(22px,7vw,35px)}.actions{gap:10px}.pill,.action{min-height:58px;font-size:19px}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<main class="app">
<section class="screen active" id="memory"><h1 class="page-title">记忆</h1><p class="page-subtitle">选择章节开始抽认卡</p><div class="list" id="chapterList"></div></section>
<section class="screen" id="study"><div class="header"><button class="back" data-screen="memory">‹</button><div class="title" id="studyTitle"></div></div><article class="card single-card" id="card"><div class="top"><span id="counterF"></span><span>⋮</span></div><div class="content"><h1 class="q" id="cardText"></h1></div><div class="hint" id="cardHint">查看答案</div></article><div class="actions" id="studyActions"><button class="pill wrong" id="wrong">× <span id="wrongN">0</span></button><button class="pill right" id="right"><span id="rightN">0</span> ✓</button></div><div class="actions hidden" id="afterActions"><button class="action fav" id="favCard">收藏</button><button class="action next" id="nextCard">下一个</button></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="screen" id="exerciseHome"><h1 class="page-title">练习</h1><p class="page-subtitle">选择章节开始选择题练习</p><div class="list" id="exerciseList"></div></section>
<section class="screen" id="exercise"><div class="header"><button class="back" data-screen="exerciseHome">‹</button><div class="title" id="exerciseTitle"></div></div><article class="exercise-card"><div class="counter" id="exerciseCounter"></div><h2 class="exercise-q" id="exerciseQuestion"></h2><div class="options" id="exerciseOptions"></div><div class="explain" id="explain"></div><div class="actions hidden" id="exerciseActions"><button class="action fav" id="favExercise">收藏</button><button class="action next" id="nextExercise">下一题</button></div></article></section>
<section class="screen" id="favorites"><h1 class="page-title">收藏</h1><p class="page-subtitle">本机收藏，不同步</p><div class="favorites" id="favoritesList"></div></section>
</main>
<nav class="tabs"><button class="tab active" data-screen="memory">记忆</button><button class="tab" data-screen="exerciseHome">练习</button><button class="tab" data-screen="favorites">收藏</button></nav>
<script>
const chapters = [{"id": "chapter-1", "title": "第一章：概论", "description": "GIS 基础概念与发展", "cards": [{"front": "数据（Data）在认识世界过程中被定义为何种形式的记录？", "back": "是对事物和环境描述的直接或间接原始记录，是未经加工的原始资料。"}, {"front": "信息（Information）区别于数据的本质特征是什么？", "back": "信息是数据内涵的意义，是提供关于现实世界新的事实和知识的依据。"}, {"front": "在地理信息系统中，“信息是数据的表达，数据是信息的_____”。", "back": "载体"}, {"front": "信息具有的四个基本特征包括客观性、适用性、可传输性和_____。", "back": "共享性"}, {"front": "地理数据（Geographical Data）的五个核心特征是什么？", "back": "空间上的分布性、时间上的序列性、数量上的海量性、载体的多样性、位置与属性的对应性。"}, {"front": "地理数据特征中的“空间上的分布性”遵循什么逻辑顺序？", "back": "先定位，后定性。"}, {"front": "地理对象或现象的数据描述由哪三部分组成？", "back": "空间位置、属性数据（非空间数据）、时域数据。"}, {"front": "空间位置数据除了可以根据大地参照系定义坐标，还可以定义为地物间的什么关系？", "back": "相对位置关系（如空间上的相邻、包含等）。"}, {"front": "属性数据（Attribute Data）主要解决的是地理环境研究中的什么问题？", "back": "按照专题来表达多维和多层次的非空间属性信息。"}, {"front": "时域数据（Temporal Data）在地理信息系统中的主要作用是什么？", "back": "记录数据采集或现象发生的时刻/时段，对环境模拟分析至关重要。"}, {"front": "地理信息独特的“空间相关性”特征遵循什么规律？", "back": "地理事物在空间上相距越近相关性越大，反之越小，且具有区域性特点。"}, {"front": "地理信息“空间多样性”对分析结果的解释提出了什么要求？", "back": "分析结果必须依赖于其位置，才能得出合乎逻辑的解释。"}, {"front": "地理信息“空间层次性”在尺度上如何体现？", "back": "不同空间尺度的数据具有不同的空间信息特征。"}, {"front": "按处理对象分类，信息系统可分为空间信息系统和_____。", "back": "非空间信息系统"}, {"front": "在应用层次上，地理信息系统（GIS）属于哪一类系统？", "back": "决策支持系统"}, {"front": "GIS 与其他信息系统在操作对象上的根本区别是什么？", "back": "GIS 的对象是按统一地理坐标编码的空间数据（点、线、面、体）。"}, {"front": "GIS 被誉为地学的第几代语言？", "back": "第三代语言（用数字形式描述空间实体）。"}, {"front": "为什么说 GIS 中的属性信息处理相当于普通的事务性信息处理系统？", "back": "因为属性数据描述的是除空间位置及关系外的定性或定量信息。"}, {"front": "GIS 空间数据管理中，相对于事务性数据，其最显著的物理特征是什么？", "back": "不定长性（如多边形顶点数量不一）。"}, {"front": "地理信息系统海量数据的来源主要包括地理数据本身和_____。", "back": "空间分析过程中不断产生的新空间数据。"}, {"front": "GIS 运行环境的五大部分组成是什么？", "back": "硬件系统、软件系统、空间数据、地学模型、管理与应用人员。"}, {"front": "GIS 软件系统架构从底层到顶层依次是什么？", "back": "GIS 支撑软件、GIS 平台软件、GIS 应用软件。"}, {"front": "操作系统（如 Windows, Linux）和数据库管理系统（如 Oracle）属于 GIS 软件的哪一类？", "back": "GIS 支撑软件"}, {"front": "GIS 平台软件的主要表现形式包括基础应用程序和_____。", "back": "软件开发包（SDK）"}, {"front": "GIS 应用软件与平台软件的关系是什么？", "back": "应用软件是基于平台软件提供的功能和接口，针对行业具体业务需求二次开发而成的。"}, {"front": "在 GIS 数据中，用于表示点、线、面实体之间联系的关系称为什么？", "back": "拓扑关系（Topology）。"}, {"front": "定性属性数据包括名称、类型、特性等，定量属性数据则包括_____。", "back": "数量和等级"}, {"front": "地学模型（Geoscientific Model）在 GIS 中的作用是什么？", "back": "构建能表达或模拟特定现象的计算机模型，为复杂应用提供解决方案。"}, {"front": "GIS 解决的 5 个基本地理问题是什么？", "back": "位置（Location）、条件（Condition）、趋势（Trend）、模式（Pattern）、模拟（Simulation）。"}, {"front": "GIS 的“位置”问题主要通过哪种技术实现？", "back": "空间查询技术"}, {"front": "“符合某些条件的地理对象在哪里”属于 GIS 解决的哪类基本问题？", "back": "条件问题"}, {"front": "“趋势”问题要求 GIS 具备根据历史数据进行哪种分析的能力？", "back": "预测未来和回溯过去。"}, {"front": "GIS 的“模式”问题主要探讨地理实体分布之间的什么？", "back": "空间关系"}, {"front": "GIS 的 6 个基本功能模块包括数据采集、编辑处理、存储管理、分析查询、应用开发和_____。", "back": "数据输出与可视化表达"}, {"front": "目前常用的 GIS 空间数据结构主要有矢量数据结构和_____。", "back": "栅格数据结构"}, {"front": "数据可视化表达中，传递空间信息最有效的工具是什么？", "back": "图形（地图）"}, {"front": "GIS 功能中的“二次开发”通常提供什么支持？", "back": "完整的 API（应用程序接口）和开发环境。"}, {"front": "测量学和遥感技术在 GIS 中扮演的主要角色是什么？", "back": "提供快速、可靠、多时相和廉价的多种信息源。"}, {"front": "GIS 空间分析的理论基础主要由哪门学科提供？", "back": "地理学"}, {"front": "GIS 最初是从哪种技术起步的？", "back": "机助制图（Computer-Aided Cartography）。"}, {"front": "GIS 与数字制图系统的主要区别在于什么？", "back": "深层次的空间分析功能（如缓冲区分析、叠置分析等）。"}, {"front": "相对于 CAD，GIS 在数据处理上的强项是什么？", "back": "属性功能强，能够处理复杂的地理空间自然目标，且具有强大的海量数据图库管理能力。"}, {"front": "遥感图像处理系统强调对栅格数据的几何和灰度处理，而 GIS 更侧重于实体的什么描述？", "back": "空间关系描述及属性查询。"}, {"front": "1998 年由美国副总统戈尔提出的概念是_____。", "back": "数字地球（Digital Earth）"}, {"front": "被称为第三代互联网应用，旨在实现资源全面共享的 GIS 模式是_____。", "back": "网格 GIS（GRID GIS）"}, {"front": "VR GIS 采用哪种主要语言将数据转换到虚拟环境中？", "back": "VRML（虚拟现实建模语言）。"}, {"front": "移动 GIS 实现“4A 服务”指哪四个方面？", "back": "任何地方、任何时间、任何人、任何事 (Anywhere, Anytime, Anyone, Anything)。"}, {"front": "智慧城市建设中，动态获取城市空间物联信息的基础基建是什么？", "back": "物联网（IoT）"}, {"front": "云计算数据中心为 GIS 用户提供的核心价值不再是硬件设备，而是_____。", "back": "计算能力和可用性的各项功能。"}, {"front": "时空大数据相比传统数据，在特征上表现出更强的动态性和_____。", "back": "流动性"}, {"front": "在大数据 GIS 中，哪种计算技术在数据处理和分析环节发挥重要作用？", "back": "并行计算（如 Hadoop, Spark）。"}, {"front": "机器学习相比传统数据挖掘在 GIS 分析中的优势是什么？", "back": "算法带有自调试参数，能通过学习自我完善，提高挖掘和预测的准确性。"}, {"front": "1:5 万与 1:1 万坡度分级数据的差异，体现了地理信息的哪种特性？", "back": "空间尺度上的层次性。"}, {"front": "GIS 的物理外壳是_____。", "back": "计算机化的技术系统"}, {"front": "为什么地理数据库的更新应当是分布式的？", "back": "因为地理信息在区域上表现出分布式特点，且属性表现为多层次。"}], "exercises": [{"question": "关于数据与信息的关系，下列说法正确的是？", "options": {"A": "数据本身就是信息", "B": "信息是数据的载体，数据是信息的表达", "C": "信息是向人们提供现实世界新事实的依据，来源于数据", "D": "数据蕴涵的信息会自动呈现出来"}, "correctAnswer": "C", "explanation": "数据是未经加工的原始资料，是客观对象的表示，其本身并不是信息。信息来源于数据，是数据内涵的意义和对数据内容的解释。数据蕴涵的信息不会自动呈现出来，需要利用技术对其解释。信息是数据的表达，数据是信息的载体。因此，C项表述正确。"}, {"question": "地理实体和地理现象的数据描述标准通常不包括以下哪一部分？", "options": {"A": "空间位置数据", "B": "拓扑结构编码", "C": "属性数据", "D": "时域数据"}, "correctAnswer": "B", "explanation": "地理对象或地理现象的数据描述包括空间位置、属性数据（简称属性）及时域数据三部分。虽然拓扑关系是空间数据的一种类型，但在宏观描述地理数据的三大核心构成时，标准术语为空间位置、属性数据和时域数据。"}, {"question": "“在不同地方或区域上，地理数据的变化趋势是不同的”，这句话深刻体现了地理信息的哪种独特特性？", "options": {"A": "空间相关性", "B": "空间区域性", "C": "空间多样性", "D": "空间层次性"}, "correctAnswer": "C", "explanation": "空间多样性指在不同地方或区域上，地理数据的变化趋势是不同的，这意味着地理信息的分析结果需要依赖于其位置，才能得出合乎逻辑的解释。空间相关性强调距离越近相关性越大；区域性强调天然的分区组织特征；层次性强调多重属性或空间尺度。"}, {"question": "如果根据应用层次对信息系统进行分类，地理信息系统（GIS）属于下列哪种系统？", "options": {"A": "事务处理系统", "B": "空间信息系统", "C": "决策支持系统", "D": "管理信息系统"}, "correctAnswer": "C", "explanation": "在应用层次上，信息系统有事务处理系统、管理信息系统、决策支持系统等系统。地理信息系统在处理对象上属空间信息系统，而在应用层次上则属决策支持系统。"}, {"question": "GIS区别于其它类型普通信息系统的根本标志在于？", "options": {"A": "具有海量数据的压缩管理能力", "B": "能够进行复杂的跨表属性查询", "C": "每一个数据都按统一的地理坐标进行编码，实现定位、定性和定量的描述", "D": "采用了最先进的云计算与并行计算技术"}, "correctAnswer": "C", "explanation": "空间数据的最根本特点是每一个数据都按统一的地理坐标进行编码，实现对其定位、定性和定量的描述，这是GIS区别于其它类型信息系统的根本标志，也是其技术难点之所在。"}, {"question": "在学术界，GIS常被誉为“地学的第三代语言”，这主要是因为它？", "options": {"A": "是地理科学第二次革命的主要工具", "B": "能够用数字形式来描述空间实体", "C": "完美结合了测绘学和遥感技术", "D": "拥有最复杂的拓扑查询语言"}, "correctAnswer": "B", "explanation": "GIS被誉为地学的第三代语言，其核心含义是指它能够用数字形式来描述空间实体。"}, {"question": "在GIS发展历程中，其简称“GIS”中的“S”含义经历了显著演变。当它代表人们日常生活中的大众化应用（如导航软件）时，这个“S”代表的是？", "options": {"A": "System（系统）", "B": "Science（科学）", "C": "Service（服务）", "D": "Society（社会）"}, "correctAnswer": "C", "explanation": "随着互联网技术、计算机技术的普及，地理信息系统已经从单纯的技术型和研究型逐步向地理信息服务层面转移，在这一层面上，“S”一词代表着服务（Service）。"}, {"question": "在GIS系统的五大组成部分中，被形容为GIS的“血液”的是？", "options": {"A": "计算机硬件", "B": "软件系统", "C": "地学模型", "D": "空间数据"}, "correctAnswer": "D", "explanation": "数据是GIS的核心内容，贯穿于GIS的各个过程，有人将它称之为GIS的血液。"}, {"question": "在GIS的各个组成部分中，最为关键和具有能动性因素的是哪一项？", "options": {"A": "处理海量数据的服务器", "B": "高效的空间数据库", "C": "管理与应用人员", "D": "用于空间分析的地学模型"}, "correctAnswer": "C", "explanation": "人是GIS中的重要构成因素。人员是系统建设中的关键和能动性因素，直接影响和协调其它几个组成部分。"}, {"question": "为了解决特定行业复杂的业务问题（如河网提取），GIS引入了哪一组成部分来提供具体的解决方案？", "options": {"A": "关系型数据库系统", "B": "地学模型", "C": "全站仪和GPS设备", "D": "操作系统底座"}, "correctAnswer": "B", "explanation": "模型为GIS应用提供解决方案。地学模型是根据具体的地学目标和问题，以GIS已有的操作和方法为基础，构建能够表达或模拟特定现象的计算机模型。"}, {"question": "空间数据包括三种互相联系的数据类型，用来表示点、线、面实体之间（如相邻、包含）空间联系的数据属于？", "options": {"A": "空间位置数据（几何坐标）", "B": "空间关系数据（拓扑关系）", "C": "属性数据（非几何属性）", "D": "时态数据序列"}, "correctAnswer": "B", "explanation": "实体间的空间相关性即拓扑关系，表示点、线、面实体之间的空间联系，如边界线与面实体间的构成关系，面实体与内部点的包含关系等。"}, {"question": "在GIS软件系统中，像Windows、Linux这样的操作系统，以及Oracle等大型数据库管理系统，被统一归类为？", "options": {"A": "GIS应用软件", "B": "GIS平台软件", "C": "GIS支撑软件", "D": "GIS功能组件包"}, "correctAnswer": "C", "explanation": "GIS支撑软件是指GIS运行所必需的各种软件环境，如操作系统、数据库管理系统、图形处理系统等。"}, {"question": "教材中常将“GIS空间分析”与“GIS应用分析”的关系生动地比喻为？", "options": {"A": "“血液”与“躯体”", "B": "“零件”与“机器”", "C": "“骨骼”与“肌肉”", "D": "“软件”与“硬件”"}, "correctAnswer": "B", "explanation": "GIS空间分析为建立和解决复杂的应用模型提供了基本工具，因此GIS空间分析和应用分析是“零件”和“机器”的关系。用户应用GIS解决实际问题的关键，就是如何将这些零件搭配成解决问题的“机器”。"}, {"question": "GIS可以求解五个基本问题。当需要根据历史数据对地貌未来的发育演变进行分析判断时，这解答的是哪类基本问题？", "options": {"A": "位置问题", "B": "条件问题", "C": "趋势问题", "D": "模式问题"}, "correctAnswer": "C", "explanation": "趋势问题探讨某个地方发生的某个事件及其随时间的变化过程，要求GIS能够对现象的变化过程做出分析判断，并能对未来做出预测和对过去做出回溯。"}, {"question": "由于原始空间数据不可避免含有误差，为了保证数据在一致性和完整性上的逻辑正确，GIS必须具备以下哪种功能？", "options": {"A": "数据采集功能", "B": "数据编辑与处理功能", "C": "空间查询功能", "D": "数据可视化输出功能"}, "correctAnswer": "B", "explanation": "为保证数据在内容、逻辑、数值上的一致性和完整性，需要对数据进行编辑、格式转换、拼接等一系列的处理工作，包括图形编辑、拓扑建立等，这属于数据编辑与处理功能。"}, {"question": "关于空间数据的组织与管理，下列说法中正确的是？", "options": {"A": "一般信息系统的数据结构完全适合直接管理空间数据", "B": "所有的GIS空间数据仅能通过栅格数据结构来存储", "C": "目前有些GIS的图形数据也开始交给扩展了空间功能的商用关系数据库管理系统管理", "D": "空间数据必须与属性数据物理隔离，互不关联"}, "correctAnswer": "C", "explanation": "一般信息系统的数据结构和数据库管理系统并不适合管理空间数据。但目前随着技术发展，有些GIS的图形数据也交给关系数据库管理系统管理，且关系数据库管理系统也在向空间数据管理方面扩展（如Oracle等）。"}, {"question": "作为GIS的分析理论基础，可为GIS提供引导空间分析的方法和观点的学科是？", "options": {"A": "计算机科学", "B": "地图制图学", "C": "地理学", "D": "测量学"}, "correctAnswer": "C", "explanation": "地理学是GIS的分析理论基础，可为GIS提供引导空间分析的方法和观点。"}, {"question": "GIS系统与普通关系数据库管理系统（DBMS）的主要区别体现在？", "options": {"A": "DBMS只能存储图片，不能存储文字", "B": "GIS不仅需要数据管理功能，还需要具有图形数据的采集、可视化和空间分析功能", "C": "DBMS运行速度永远比GIS慢", "D": "GIS只处理单一定长的字符串数据"}, "correctAnswer": "B", "explanation": "地理信息系统除需要功能强大的空间数据的管理功能之外，还需要具有图形数据的采集、空间数据的可视化和空间分析等功能，在功能和软硬件方面比一般事务数据库更复杂。"}, {"question": "许多工程人员将计算机辅助设计（CAD）作为数字制图工具。与GIS相比，CAD系统存在的主要局限性是？", "options": {"A": "CAD无法处理规则的几何图形", "B": "CAD没有坐标参考系统", "C": "CAD属性功能相对较弱，空间分析能力和海量图库管理能力较弱", "D": "CAD无法进行任何数据的输出"}, "correctAnswer": "C", "explanation": "CAD处理的多为规则几何图形，图形功能极强，但属性功能相对较弱。而GIS处理多为复杂的自然与人工目标，具有丰富的属性库和极强的空间分析功能，同时CAD一般仅在单幅图上操作，海量数据的图库管理能力较弱。"}, {"question": "遥感（RS）技术在地理信息系统体系中扮演的最主要角色是？", "options": {"A": "提供所有的拓扑空间分析算法", "B": "作为数据库底层的操作系统软件", "C": "为GIS的数据更新提供丰富、实时、可靠和廉价的多种信息源", "D": "替代GIS直接进行社会经济人口数据的统计与可视化"}, "correctAnswer": "C", "explanation": "测绘学和遥感技术不但为GIS提供快速、可靠、多时相和廉价的多种信息源，而且其获取的影像常进入GIS系统作为背景影像或协同集成分析。"}, {"question": "在20世纪60年代的GIS开拓期，严重制约地理信息系统图形和地学分析功能发展的客观瓶颈是？", "options": {"A": "缺乏地学理论的引导", "B": "测绘人员的数据采集意愿低", "C": "计算机硬件存储能力小且磁带存取速度极慢", "D": "没有任何面向部门的专业需求"}, "correctAnswer": "C", "explanation": "在20世纪60年代的开拓起步阶段，计算机硬件系统的功能还很弱，计算机存储能力很小且磁带存取速度也很慢，极大地制约着地理信息系统的发展。"}, {"question": "在GIS技术的巩固发展期（20世纪70年代），GIS软件技术取得的最重要的进展标志是？", "options": {"A": "人机图形交互技术的发展", "B": "云计算平台的搭建", "C": "自动人工智能影像识别", "D": "移动互联网定位的突破"}, "correctAnswer": "A", "explanation": "在20世纪70年代，由于图形、图像卡等技术的发展增强了人机对话和显示功能，人机图形交互技术的发展成为这一时期软件的最重要进展。"}, {"question": "1998年由美国副总统戈尔提出的，核心思想是用数字化手段统一处理地球问题并嵌入海量多分辨率数据的标志性概念是？", "options": {"A": "物联网GIS", "B": "数字地球", "C": "虚拟现实地球", "D": "智慧城市网格"}, "correctAnswer": "B", "explanation": "1998年美国副总统戈尔提出“数字地球”的概念，其核心思想是用数字化手段统一处理地球问题和最大限度地利用信息资源。"}, {"question": "被称为第三代互联网应用，能够把分布的计算机集群集成在一起，实现空间信息分布式、协作化和智能化处理的技术是？", "options": {"A": "网格GIS（Grid GIS）", "B": "移动GIS（Mobile GIS）", "C": "时态GIS（Temporal GIS）", "D": "互操作GIS（Interoperable GIS）"}, "correctAnswer": "A", "explanation": "网格(Grid)被称为第三代互联网应用，它是把整个互联网整合成一台巨大的超级计算机，基于网格计算的GIS平台，能够分布式、协作化和智能化地处理地理信息。"}, {"question": "能够提供“4A服务”（在任何时间、任何地点为任何人、任何事服务），例如个人位置服务和车辆导航定位的技术形态是？", "options": {"A": "VR GIS", "B": "云 GIS", "C": "移动 GIS", "D": "并行 GIS"}, "correctAnswer": "C", "explanation": "无线通信技术、移动定位技术和WebGIS的结合形成了移动GIS，它可以使地理信息随时、随地、为任何人、任何事进行服务（4A服务）。"}, {"question": "在现代“智慧城市”中，能够通过大量装载在对象上的传感器实时获取动态属性与位置信息，从而极大扩展GIS底层感知网络的技术是？", "options": {"A": "计算机辅助设计(CAD)", "B": "虚拟建模语言(VRML)", "C": "传统纸质地图扫描", "D": "物联网(IoT)"}, "correctAnswer": "D", "explanation": "物联网通过装载在物联对象上的传感器实时、动态地获取信息，这些物联网产生的数据都带有位置和时间信息，促进了GIS的发展并为城市空间物联信息的应用提供基础。"}, {"question": "面临企业级应用海量多源数据的压力，目前改变了计算机为用户提供服务的模式，使得“托管的不再是客户本地设备，而是云端的计算能力”的技术是？", "options": {"A": "桌面端个人关系型数据库", "B": "移动单机导航软件", "C": "云计算与云数据中心", "D": "机助制图系统"}, "correctAnswer": "C", "explanation": "云计算数据中心改变了计算机为用户提供服务的模式，云数据中心中托管的不再是客户的设备，而是计算能力和可用性的各项功能。"}, {"question": "传统的GIS数据管理技术无法应对现今多源、异构的时空大数据。为解决这一难题，在数据处理和分析环节广泛引入的成熟方案是？", "options": {"A": "增加单机的机械硬盘存储", "B": "退回使用手工记录表格", "C": "采用基于Hadoop和Spark等架构的并行计算技术", "D": "仅使用关系型数据库单线程查询"}, "correctAnswer": "C", "explanation": "时空大数据处理与分析是大数据GIS的核心内容，目前基于 Hadoop 和 Spark 等并行计算技术的空间数据处理与管理，是较为成熟并广泛使用的方案之一。"}, {"question": "在处理复杂的时空大数据挖掘时，传统的数据分析难以发现隐含规律。现代GIS正逐步引入哪种前沿算法，使其能够通过自调试参数实现“自我学习”和准确预测？", "options": {"A": "静态几何量算", "B": "固定条件筛选语言 (SQL)", "C": "机器学习与人工智能", "D": "人工拓扑查错"}, "correctAnswer": "C", "explanation": "机器学习的算法不是固定的，而是带有自调试参数，能够随着分析内容和频次的增加，让计算机通过学习自我完善，使挖掘和预测的结果更准确。"}, {"question": "公安部门通过分析特定城市内犯罪几率与该市酒吧、交通、照明等元素的耦合关系，以此提炼出能推广到其他城市的犯罪预警模型。这最主要体现了GIS解决的哪类基本问题？", "options": {"A": "位置问题 (Location)", "B": "趋势问题 (Trend)", "C": "模拟问题 (Simulation)", "D": "条件问题 (Condition)"}, "correctAnswer": "C", "explanation": "模拟即某个地方如果具备某种条件会发生什么问题，是在模式和趋势的基础上，建立现象和因素之间的模型关系。例如研究犯罪几率和周边因素分布的耦合关系，建立通用模型进行未来预测决策。"}]}, {"id": "chapter-2", "title": "第二章：地理空间数学基础", "description": "地球参考、投影、尺度与格网", "cards": [{"front": "地理空间的数学基础主要包括哪三个方面？", "back": "地球空间参考、空间数据投影及坐标转换、空间尺度及地理格网。"}, {"front": "地球表面的几何模型通常分为哪四类？", "back": "地球自然表面、大地水准面、地球椭球面、数学模型。"}, {"front": "什么是“大地水准面”？", "back": "假设海水处于静止平衡状态并延伸到大陆下部，与重力方向处处正交的连续闭合水准面。"}, {"front": "在大地测量和 GIS 应用中，通常选择什么作为地球的理想模型？", "back": "旋转椭球（地球椭球）。"}, {"front": "地球椭球的数学表达式中，参数 $a$ 和 $b$ 分别代表什么？", "back": "$a$ 为长半径（近似赤道半径），$b$ 为极轴半径。"}, {"front": "中国 1980 西安坐标系所采用的参考椭球是什么？", "back": "1975 年国际椭球。"}, {"front": "什么是“椭球定位”？", "back": "依据一定条件，将具有给定参数的椭球与大地体的相关位置确定下来。"}, {"front": "参考定位与绝对定位的主要区别是什么？", "back": "参考定位强调局部符合（如西安 80），绝对定位强调全球符合（如 WGS 84）。"}, {"front": "球面坐标系统主要由哪两个基本参数组成？", "back": "一个地球椭球和一个大地基准面。"}, {"front": "平面坐标系统在包含球面坐标系统参数的基础上，还必须指定什么？", "back": "投影规则（映射关系）。"}, {"front": "天文地理坐标系是以什么为依据建立的？", "back": "大地体（垂线方向）。"}, {"front": "参心空间直角坐标系的原点位于何处？", "back": "参考椭球的中心。"}, {"front": "地心空间直角坐标系的原点位于何处？", "back": "地球质心。"}, {"front": "中国从 2008 年起启用的地心坐标系统简称为什么？", "back": "CGCS2000（2000 国家大地坐标系）。"}, {"front": "在高斯平面直角坐标系中，规定以什么为 $X$ 轴？", "back": "中央经线。"}, {"front": "在高斯平面直角坐标系中，规定以什么为 $Y$ 轴？", "back": "赤道。"}, {"front": "为了避免 $y$ 值出现负值，高斯坐标系规定各投影带的坐标纵轴向西移动多少距离？", "back": "$500\\text{ km}$。"}, {"front": "高斯通用坐标（如 $19\\ 738765.2\\text{ m}$）前两位数字表示什么？", "back": "投影带的编号。"}, {"front": "建立“地方独立平面直角坐标系”的主要目的是什么？", "back": "减小高斯投影产生的长度变形。"}, {"front": "什么是“高程系统”？", "back": "相对于不同性质的参考面（如大地水准面、地球椭球面）所定义的高程体系。"}, {"front": "以地球椭球面为参考面的高程称为什么？", "back": "大地高。"}, {"front": "什么是“深度基准”？", "back": "海图图载水深及其相关要素的起算面。"}, {"front": "深度基准面的选择必须遵循哪两个原则？", "back": "保证航行安全和充分利用航道。"}, {"front": "地图投影的实质是什么？", "back": "建立地面地理坐标 $(B, L)$ 与地图平面坐标 $(X, Y)$ 之间一一对应的函数关系。"}, {"front": "地图投影的变形通常分为哪三种？", "back": "长度变形、面积变形、角度变形。"}, {"front": "长度比 $\\mu$ 的定义是什么？", "back": "投影后的微分线段长度 $ds'$ 与实地长度 $ds$ 之比（$\\mu = \\frac{ds'}{ds}$）。"}, {"front": "若面积比 $P=1$，则该投影属于什么性质的投影？", "back": "等面积投影。"}, {"front": "等角投影又常被称为什么投影？", "back": "正形投影。"}, {"front": "几何投影按辅助投影面的类型可分为哪三类？", "back": "方位投影、圆柱投影、圆锥投影。"}, {"front": "什么是“正轴投影”？", "back": "投影面的中心轴与地轴重合。"}, {"front": "伪圆柱投影的纬线和经线形状有何特征？", "back": "纬线为平行直线，中央经线为直线，其余经线为对称曲线。"}, {"front": "高斯-克吕格投影在投影分类上属于哪种类型？", "back": "横轴等角切圆柱投影。"}, {"front": "高斯投影中，长度变形在何处达到最大？", "back": "边缘处（赤道与带边缘交点）。"}, {"front": "高斯投影 $6^{\\circ}$ 带第 1 带的中央经线是多少度？", "back": "$3^{\\circ}\\text{ E}$。"}, {"front": "中国 $1:1$ 万比例尺地形图采用几度分带？", "back": "$3^{\\circ}$ 分带。"}, {"front": "UTM 投影与高斯投影的主要区别之一是中央经线的长度比，UTM 规定为多少？", "back": "$0.9996$。"}, {"front": "兰勃特等角投影（Lambert）通常属于哪种几何投影？", "back": "正轴等角割圆锥投影。"}, {"front": "中国全图（含南海诸岛插图）常用的投影是什么？", "back": "正轴等面积割圆锥投影（Lambert 投影）。"}, {"front": "在东西延伸的中纬度地区（如中国），一般多采用哪种投影？", "back": "正轴圆锥投影。"}, {"front": "在南北方向延伸的地区（如智利），一般采用什么投影？", "back": "横轴圆柱投影或多圆锥投影。"}, {"front": "同一地理坐标基准下的坐标变换，若无直接解析式，通常采用什么方法？", "back": "间接变换（反算回球面坐标再正算到新投影）。"}, {"front": "多项式拟合变换主要应用于什么情况？", "back": "无法获取参与转换的空间参考投影信息时。"}, {"front": "地图比例尺的数字式表示法举例。", "back": "$1:100000$ 或 $1:10$ 万。"}, {"front": "什么是数字地图中的“无级比例尺”概念？", "back": "数据存储在计算机中，可以根据需要按比例任意缩小或放大，不固定在单一比例尺。"}, {"front": "空间分辨率的定义是什么？", "back": "图像中目标空间细节可分辨的最小尺寸。"}, {"front": "什么是“操作尺度”？", "back": "对空间实体、现象数据进行处理操作时应采用的最佳尺度。"}, {"front": "地理坐标格网（经纬度坐标）的主要缺点是什么？", "back": "实地大小不均匀（高纬度小，低纬度大）。"}, {"front": "直角坐标格网的主要优点是什么？", "back": "实地格网大小均匀。"}], "exercises": [{"question": "地球表面的几何模型中，被称为“重力等位面”的是？", "options": {"A": "固体地球表面", "B": "大地水准面", "C": "地球椭球面", "D": "数学曲面"}, "correctAnswer": "B", "explanation": "A 错误：固体地球表面是极其复杂的不规则曲面，不是重力等位面。B 正确：大地水准面是一个重力等位面，在理论上与静止海平面重合。C 错误：地球椭球面是一个规则的数学曲面，并不是重力等位面。D 错误：数学模型是为了解决特定测量问题而提出的面，如类地形面等。"}, {"question": "1954年北京坐标系采用的参考椭球是？", "options": {"A": "WGS-84椭球", "B": "1975年国际椭球", "C": "克拉索夫斯基椭球", "D": "海福特椭球"}, "correctAnswer": "C", "explanation": "A 错误：WGS-84椭球是1984年创立的，应用于WGS-84坐标系。B 错误：1975年国际椭球被中国1980西安坐标系所采用。C 正确：中国1954年北京坐标系采用的是克拉索夫斯基椭球。D 错误：海福特椭球是中国1953年以前采用的参考椭球。"}, {"question": "确定参考椭球与大地体的位置关系，在大地测量学中称为什么？", "options": {"A": "椭球定位", "B": "投影转换", "C": "高程基准", "D": "空间尺度"}, "correctAnswer": "A", "explanation": "A 正确：指定一个大地基准面将椭球体与大地体联系起来，称为椭球定位。B 错误：投影转换是指空间数据从一种参考系映射到另一种参考系。C 错误：高程基准是推算水准高程的起算依据。D 错误：空间尺度是研究者选择观察世界的窗口。"}, {"question": "下列坐标系中，起算原点与地球质心重合的是？", "options": {"A": "1954年北京坐标系", "B": "1980西安坐标系", "C": "参心空间直角坐标系", "D": "2000国家大地坐标系 (CGCS2000)"}, "correctAnswer": "D", "explanation": "A 错误：北京54属于参心坐标系，原点不与地球质心重合。B 错误：西安80也属于参心坐标系，原点设在椭球中心。C 错误：参心坐标系原点位于参考椭球中心，不与质心重合。D 正确：CGCS2000属于地心坐标系统，起算原点和地球质心重合。"}, {"question": "天文地理坐标系是以什么为坐标原点的？", "options": {"A": "参考椭球中心", "B": "地心（地球质量中心）", "C": "赤道与中央经线交点", "D": "格林尼治天文台"}, "correctAnswer": "B", "explanation": "A 错误：参考椭球中心是参心空间直角坐标系的原点。B 正确：天文地理坐标系以地心为坐标原点。C 错误：赤道与中央经线交点是高斯平面直角坐标系的原点。D 错误：格林尼治天文台用于定义天文首子午面，并非坐标原点。"}, {"question": "为了避免y值出现负值，高斯平面直角坐标系规定各投影带的坐标纵轴应如何平移？", "options": {"A": "东移500km", "B": "西移500km", "C": "东移500m", "D": "西移500m"}, "correctAnswer": "B", "explanation": "A 错误：东移会使得中央经线以西区域的y值仍然为负。B 正确：规定纵轴均西移500km，使得原横坐标值由0变为500km，以避免负值。C 错误：平移单位是公里(km)，且方向为西移。D 错误：平移单位是公里(km)，不是米(m)。"}, {"question": "若某点位于第19带，横坐标西移前为238765.2m，则其通用横坐标表示为？", "options": {"A": "738765.2m", "B": "19238765.2m", "C": "19738765.2m", "D": "19500000m"}, "correctAnswer": "C", "explanation": "A 错误：738765.2m是西移后的横坐标，但未加带号无法区分不同投影带。B 错误：该值仅加上了带号，没有加上西移的500000m。C 正确：西移后横坐标为738765.2m，在前面加上带号19，即19738765.2m。D 错误：这是直接用带号拼接500km的错误形式。"}, {"question": "建立地方独立直角坐标系时，地方参考椭球的半径会随什么参数而增大？", "options": {"A": "经度差异", "B": "纬度变化", "C": "当地平均海拔高程和高程异常", "D": "中央子午线偏移量"}, "correctAnswer": "C", "explanation": "A 错误：地方参考椭球半径变化与经度差异无关。B 错误：参考椭球半径增大与纬度变化无关。C 正确：其椭球半径增大量与当地平均海拔高程及平均高程异常有关。D 错误：中央子午线选取用于投影面确定，不改变椭球半径公式。"}, {"question": "1985国家高程基准面是通过哪个验潮站的资料确定的？", "options": {"A": "废黄河验潮站", "B": "坎门验潮站", "C": "大连验潮站", "D": "青岛大港验潮站"}, "correctAnswer": "D", "explanation": "A 错误：我国曾使用过废黄河高程基准，但不是1985国家基准。B 错误：坎门高程基准是我国以前使用过的高程基准之一。C 错误：大连高程基准也是以前使用过的基准。D 正确：基准面为青岛大港验潮站1952－1979年资料确定的黄海平均海面。"}, {"question": "在海图中，所谓的“图载水深”指的是哪两面之间的距离？", "options": {"A": "深度基准面至海底", "B": "平均海面至海底", "C": "大地水准面至海底", "D": "最高潮面至海底"}, "correctAnswer": "A", "explanation": "A 正确：图载水深是该深度基准面至海底的距离。B 错误：平均海面向下一定深度才是深度基准面。C 错误：水深的起算面是深度基准面，而非大地水准面。D 错误：深度基准常位于海面以下较低位置以保证航行安全，与最高潮面无关。"}, {"question": "用符号Vμ表示长度变形，当Vμ<0时，表示？", "options": {"A": "投影后长度没有变形", "B": "投影后长度缩小", "C": "投影后长度增加", "D": "投影后长度成倍放大"}, "correctAnswer": "B", "explanation": "A 错误：Vμ=0时，投影后长度才没有变形。B 正确：当Vμ<0时，表示投影后长度缩小。C 错误：当Vμ>0时，表示投影后长度增加。D 错误：Vμ<0表示缩小变形，不是放大。"}, {"question": "在投影变形椭圆中，如果长半轴a与短半轴b相等（a=b），则该投影属于？", "options": {"A": "等距投影", "B": "等积投影", "C": "等角投影", "D": "任意投影"}, "correctAnswer": "C", "explanation": "A 错误：等距离投影的变形椭圆某一半轴与微分圆半径相等（如b=r）。B 错误：等面积投影的变形椭圆特征是a·b=r²。C 正确：如果投影后为大小不同的圆形（a=b），则该投影为等角投影。D 错误：任意投影的面积不等且形状各异。"}, {"question": "按照投影面与地球自转轴的关系，投影面中心轴与地轴相互垂直的投影称为？", "options": {"A": "正轴投影", "B": "横轴投影", "C": "斜轴投影", "D": "割投影"}, "correctAnswer": "B", "explanation": "A 错误：正轴投影的中心轴与地轴重合。B 正确：横轴投影的投影面中心轴与地轴相互垂直。C 错误：斜轴投影的中心轴与地轴斜交。D 错误：割投影是按投影面与地球表面相割关系划分的。"}, {"question": "高斯—克吕格投影按照构成方法属于哪种投影？", "options": {"A": "横轴等角切圆柱投影", "B": "正轴等角切圆柱投影", "C": "正轴等积割圆锥投影", "D": "斜轴等距离方位投影"}, "correctAnswer": "A", "explanation": "A 正确：在投影分类中，高斯投影是横轴等角切圆柱投影。B 错误：高斯投影是横轴而非正轴。C 错误：高斯投影使用圆柱面而非圆锥面。D 错误：高斯投影不属于方位投影。"}, {"question": "高斯投影的变形特征之一是，在同一条经线上？", "options": {"A": "长度变形随纬度降低而增大，赤道处最大", "B": "长度变形随纬度升高而增大，两极处最大", "C": "长度没有变形", "D": "长度变形恒定不变"}, "correctAnswer": "A", "explanation": "A 正确：高斯投影在同一条经线上，长度变形随纬度降低而增大，赤道处最大。B 错误：变形并非在两极处最大。C 错误：除中央经线外，其他经线上均存在变形。D 错误：长度变形随经纬度位置而改变。"}, {"question": "高斯投影6°带的划分标准是？", "options": {"A": "自东经1°30'开始，每隔6°为一带", "B": "从0度子午线起，自西向东每隔经差6°为一带", "C": "从西经180°由西向东每隔6°为一带", "D": "从本初子午线起，自东向西每隔6°为一带"}, "correctAnswer": "B", "explanation": "A 错误：自东经1°30'开始是3°带的划分标准。B 正确：6°带是从0度子午线起，自西向东每隔经差6°为一投影带。C 错误：这是UTM投影的带号编号起 function renderMathIn(element){if(window.renderMathInElement){window.renderMathInElement(element,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}}
const state = { chapter: chapters[0], cardIndex: 0, right: 0, wrong: 0, exerciseChapter: chapters[0], exerciseIndex: 0, flipped: false };
let favorites = JSON.parse(localStorage.getItem('gis-static-favorites') || '{"cards":[],"exercises":[]}');
const $ = s => document.querySelector(s);
function saveFav(){localStorage.setItem('gis-static-favorites', JSON.stringify(favorites));}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='favorites') renderFavorites();}
function renderChapters(){$('#chapterList').innerHTML=chapters.map(c=>`<button class="chapter-card" data-chapter="${c.id}"><span><span class="chapter-name">${c.title}</span><span class="chapter-meta">${c.description} · ${c.cards.length} 张卡片</span></span><span class="chapter-arrow">›</span></button>`).join('');$('#exerciseList').innerHTML=chapters.map(c=>`<button class="chapter-card" data-exercise-chapter="${c.id}"><span><span class="chapter-name">${c.title}</span><span class="chapter-meta">${c.description} · ${c.exercises.length} 道题</span></span><span class="chapter-arrow">›</span></button>`).join('');}
function updateCardSide(){const item=state.chapter.cards[state.cardIndex];$('#cardText').textContent=state.flipped?item.back:item.front;$('#cardText').className=state.flipped?'a':'q';renderMathIn($('#cardText'));$('#cardHint').textContent=state.flipped?'选择掌握情况':'查看答案';$('#card').classList.toggle('answer-side',state.flipped);}function renderCard(){const c=state.chapter;state.flipped=false;$('#studyTitle').textContent=c.title;$('#counterF').textContent=`${state.cardIndex+1} / ${c.cards.length}`;$('#bar').style.width=`${(state.cardIndex+1)/c.cards.length*100}%`;updateCardSide();$('#studyActions').classList.remove('hidden');$('#afterActions').className='actions hidden';$('#favCard').style.display='';}
function mark(ok){if(!state.flipped){state.flipped=true;updateCardSide();return;} ok?state.right++:state.wrong++;$('#rightN').textContent=state.right;$('#wrongN').textContent=state.wrong;$('#studyActions').classList.add('hidden');$('#afterActions').classList.remove('hidden');$('#afterActions').classList.toggle('one',ok);$('#favCard').style.display=ok?'none':'';}
function nextCard(){state.cardIndex=(state.cardIndex+1)%state.chapter.cards.length;renderCard();}
function favoriteCard(){const key=`${state.chapter.id}:${state.cardIndex}`;if(!favorites.cards.includes(key))favorites.cards.push(key);saveFav();$('#favCard').textContent='已收藏';}
function renderExercise(){const c=state.exerciseChapter,item=c.exercises[state.exerciseIndex];$('#exerciseTitle').textContent=c.title;$('#exerciseCounter').textContent=`${state.exerciseIndex+1} / ${c.exercises.length}`;$('#exerciseQuestion').textContent=item.question;renderMathIn($('#exerciseQuestion'));$('#explain').classList.remove('active');$('#explain').textContent='';$('#exerciseActions').className='actions hidden';$('#favExercise').style.display='';$('#favExercise').textContent='收藏';$('#exerciseOptions').innerHTML=Object.entries(item.options).map(([k,v])=>`<button class="option" data-option="${k}"><strong>${k}.</strong> ${v}</button>`).join('');renderMathIn($('#exerciseOptions'));}
function chooseOption(opt){const item=state.exerciseChapter.exercises[state.exerciseIndex], ok=opt===item.correctAnswer;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.option===item.correctAnswer)b.classList.add('correct');if(b.dataset.option===opt&&!ok)b.classList.add('incorrect');});$('#explain').textContent=`正确答案：${item.correctAnswer}。${item.explanation}`;renderMathIn($('#explain'));$('#explain').classList.add('active');$('#exerciseActions').classList.remove('hidden');$('#exerciseActions').classList.toggle('one',ok);$('#favExercise').style.display=ok?'none':'';}
function nextExercise(){state.exerciseIndex=(state.exerciseIndex+1)%state.exerciseChapter.exercises.length;renderExercise();}
function favoriteExercise(){const key=`${state.exerciseChapter.id}:${state.exerciseIndex}`;if(!favorites.exercises.includes(key))favorites.exercises.push(key);saveFav();$('#favExercise').textContent='已收藏';}
function renderFavorites(){const cards=favorites.cards.map(k=>{const [cid,i]=k.split(':'),c=chapters.find(x=>x.id===cid),item=c?.cards[+i];return item?`<article class="fav-card"><p><strong>${c.title} · 卡片 ${+i+1}</strong></p><p>${item.front}</p><p>${item.back}</p></article>`:''}).join('');const ex=favorites.exercises.map(k=>{const [cid,i]=k.split(':'),c=chapters.find(x=>x.id===cid),item=c?.exercises[+i];return item?`<article class="fav-card"><p><strong>${c.title} · 练习 ${+i+1}</strong></p><p>${item.question}</p><p>答案：${item.correctAnswer}。${item.explanation}</p></article>`:''}).join('');$('#favoritesList').innerHTML=cards+ex||'<div class="empty">还没有收藏。</div>';}
document.addEventListener('click',e=>{const s=e.target.closest('[data-screen]')?.dataset.screen;if(s)show(s);const ch=e.target.closest('[data-chapter]')?.dataset.chapter;if(ch){state.chapter=chapters.find(c=>c.id===ch);state.cardIndex=0;renderCard();show('study');}const ech=e.target.closest('[data-exercise-chapter]')?.dataset.exerciseChapter;if(ech){state.exerciseChapter=chapters.find(c=>c.id===ech);state.exerciseIndex=0;renderExercise();show('exercise');}const opt=e.target.closest('[data-option]')?.dataset.option;if(opt)chooseOption(opt);});
$('#card').addEventListener('click',()=>{state.flipped=!state.flipped;updateCardSide();});$('#wrong').onclick=()=>mark(false);$('#right').onclick=()=>mark(true);$('#nextCard').onclick=nextCard;$('#favCard').onclick=favoriteCard;$('#nextExercise').onclick=nextExercise;$('#favExercise').onclick=favoriteExercise;
renderChapters();renderCard();renderExercise();
</script>
</body>
</html>
