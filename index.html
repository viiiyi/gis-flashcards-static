<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GIS 抽认卡 · 静态版</title>
<style>
:root{--blue:#4358ff;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--ink:#2f2f2f;--text:#1f2937;--muted:#8f95a3;--line:#dde2ee;--panel:rgba(255,255,255,.84);--nav-height:78px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 88% 36%,rgba(202,255,205,.9),transparent 34%),radial-gradient(circle at 24% 72%,rgba(225,230,255,.95),transparent 36%),linear-gradient(180deg,#fff,#f7fbff);color:var(--text)}
button{appearance:none;border:0;background:none;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .22s var(--ease),box-shadow .22s,background .22s}button:active{transform:scale(.975)}
.app{width:min(1128px,100%);min-height:100svh;margin:0 auto;padding:28px 24px calc(var(--nav-height) + 26px)}.screen{display:none}.screen.active{display:block;animation:in .32s var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
.page-title{margin:8px 2px;font-size:clamp(30px,5vw,54px);letter-spacing:-.04em}.page-subtitle{margin:0 2px 24px;color:var(--muted);font-weight:800}
.list{display:grid;gap:16px}.chapter-card{width:100%;min-height:118px;padding:22px;border-radius:28px;background:var(--panel);border:1px solid rgba(217,223,238,.86);box-shadow:0 18px 48px rgba(50,55,80,.08);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;text-align:left}.chapter-name{display:block;margin-bottom:9px;font-size:clamp(22px,3.4vw,34px);font-weight:900;letter-spacing:-.03em}.chapter-meta{color:var(--muted);font-weight:800}.chapter-arrow{width:50px;height:50px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-size:28px;font-weight:900}
.header{display:flex;align-items:center;gap:14px;margin-bottom:12px}.back{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue);font-size:28px;font-weight:900}.title{color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{position:relative;width:100%;height:min(68svh,700px);min-height:430px;cursor:pointer;border-radius:38px;background:var(--ink);box-shadow:0 28px 80px rgba(50,55,80,.12);overflow:hidden;transition:background .24s var(--ease),transform .24s var(--ease)}.card.answer-side{background:#f9fafc;border:1px solid rgba(210,214,226,.9)}.top{display:flex;justify-content:space-between;padding:32px 40px 0;color:var(--muted);font-weight:900;font-size:clamp(18px,2vw,28px)}.content{flex:1;display:grid;place-items:center;padding:56px 40px 78px}.q,.a{width:100%;max-width:960px;margin:0;text-align:left;font-weight:900;line-height:1.52;letter-spacing:-.035em;word-break:break-word}.q{color:white;font-size:clamp(32px,5vw,62px)}.a{color:#2d3038;font-size:clamp(28px,4vw,50px)}.hint{position:absolute;left:0;right:0;bottom:28px;text-align:center;color:var(--muted);font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px}.pill,.action{min-height:68px;border-radius:23px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:22px;font-weight:900;box-shadow:0 12px 30px rgba(60,69,110,.06)}.wrong{color:var(--red)}.right{color:var(--green)}.action{color:white;border:0}.next{background:var(--green)}.fav{background:var(--yellow);color:#5f4500}.hidden{display:none!important}.one{grid-template-columns:1fr}
.progress{height:4px;margin-top:16px;background:rgba(67,88,255,.1);border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4358ff,#78a0ff);width:0%;transition:width .24s}
.exercise-card{padding:clamp(20px,4vw,34px);border-radius:38px;background:var(--panel);border:1px solid rgba(217,223,238,.9);box-shadow:0 24px 70px rgba(50,55,80,.12);display:flex;flex-direction:column;gap:16px}.counter{color:var(--muted);font-weight:900}.exercise-q{margin:0;font-size:clamp(24px,4vw,42px);line-height:1.45;letter-spacing:-.035em}.options{display:grid;gap:12px}.option{width:100%;min-height:62px;padding:15px 18px;border-radius:22px;background:rgba(255,255,255,.86);border:1px solid var(--line);text-align:left;font-weight:850;line-height:1.45}.option.correct{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.42);color:#087333}.option.incorrect{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35);color:#b91c1c}.explain{display:none;padding:16px;border-radius:20px;background:rgba(67,88,255,.08);line-height:1.7;font-weight:750;color:#334155}.explain.active{display:block}
.favorites{display:grid;gap:14px}.fav-card{padding:16px;border-radius:20px;background:rgba(255,255,255,.86);border:1px solid var(--line)}.fav-card p{margin:0 0 8px;line-height:1.55}.fav-card strong{color:var(--text)}
.tabs{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;width:min(560px,calc(100% - 28px));height:var(--nav-height);transform:translateX(-50%);padding:8px;border-radius:28px;background:rgba(255,255,255,.88);border:1px solid rgba(217,223,238,.9);box-shadow:0 20px 60px rgba(50,55,80,.14);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{border-radius:22px;color:var(--muted);font-weight:900}.tab.active{background:var(--blue);color:white}
.empty{min-height:220px;border:1px dashed rgba(150,158,178,.7);border-radius:28px;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5);font-weight:800;line-height:1.7}
@media(max-width:760px){:root{--nav-height:72px}.app{padding:16px 14px calc(var(--nav-height) + 22px)}.card{height:62svh;min-height:370px}.face,.exercise-card{border-radius:28px}.top{padding:20px 22px 0}.content{padding:40px 22px 64px}.q{font-size:clamp(25px,8vw,40px)}.a{font-size:clamp(22px,7vw,35px)}.actions{gap:10px}.pill,.action{min-height:58px;font-size:19px}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<main class="app">
<section class="screen active" id="memory"><h1 class="page-title">记忆</h1><p class="page-subtitle">选择章节开始抽认卡</p><div class="list" id="chapterList"></div></section>
<section class="screen" id="study"><div class="header"><button class="back" data-screen="memory">‹</button><div class="title" id="studyTitle"></div></div><article class="card single-card" id="card"><div class="top"><span id="counterF"></span><span>⋮</span></div><div class="content"><h1 class="q" id="cardText"></h1></div><div class="hint" id="cardHint">查看答案</div></article><div class="actions" id="studyActions"><button class="pill wrong" id="wrong">× <span id="wrongN">0</span></button><button class="pill right" id="right"><span id="rightN">0</span> ✓</button></div><div class="actions hidden" id="afterActions"><button class="action fav" id="favCard">收藏</button><button class="action next" id="nextCard">下一个</button></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="screen" id="exerciseHome"><h1 class="page-title">练习</h1><p class="page-subtitle">选择章节开始选择题练习</p><div class="list" id="exerciseList"></div></section>
<section class="screen" id="exercise"><div class="header"><button class="back" data-screen="exerciseHome">‹</button><div class="title" id="exerciseTitle"></div></div><article class="exercise-card"><div class="counter" id="exerciseCounter"></div><h2 class="exercise-q" id="exerciseQuestion"></h2><div class="options" id="exerciseOptions"></div><div class="explain" id="explain"></div><div class="actions hidden" id="exerciseActions"><button class="action fav" id="favExercise">收藏</button><button class="action next" id="nextExercise">下一题</button></div></article></section>
<section class="screen" id="favorites"><h1 class="page-title">收藏</h1><p class="page-subtitle">本机收藏，不同步</p><div class="favorites" id="favoritesList"></div></section>
</main>
<nav class="tabs"><button class="tab active" data-screen="memory">记忆</button><button class="tab" data-screen="exerciseHome">练习</button><button class="tab" data-screen="favorites">收藏</button></nav>
<script>
const chapters = [{"id": "chapter-1", "title": "第一章：概论", "description": "GIS 基础概念与发展", "cards": [{"front": "数据（Data）在认识世界过程中被定义为何种形式的记录？", "back": "是对事物和环境描述的直接或间接原始记录，是未经加工的原始资料。"}, {"front": "信息（Information）区别于数据的本质特征是什么？", "back": "信息是数据内涵的意义，是提供关于现实世界新的事实和知识的依据。"}, {"front": "在地理信息系统中，“信息是数据的表达，数据是信息的_____”。", "back": "载体"}, {"front": "信息具有的四个基本特征包括客观性、适用性、可传输性和_____。", "back": "共享性"}, {"front": "地理数据（Geographical Data）的五个核心特征是什么？", "back": "空间上的分布性、时间上的序列性、数量上的海量性、载体的多样性、位置与属性的对应性。"}, {"front": "地理数据特征中的“空间上的分布性”遵循什么逻辑顺序？", "back": "先定位，后定性。"}, {"front": "地理对象或现象的数据描述由哪三部分组成？", "back": "空间位置、属性数据（非空间数据）、时域数据。"}, {"front": "空间位置数据除了可以根据大地参照系定义坐标，还可以定义为地物间的什么关系？", "back": "相对位置关系（如空间上的相邻、包含等）。"}, {"front": "属性数据（Attribute Data）主要解决的是地理环境研究中的什么问题？", "back": "按照专题来表达多维和多层次的非空间属性信息。"}, {"front": "时域数据（Temporal Data）在地理信息系统中的主要作用是什么？", "back": "记录数据采集或现象发生的时刻/时段，对环境模拟分析至关重要。"}, {"front": "地理信息独特的“空间相关性”特征遵循什么规律？", "back": "地理事物在空间上相距越近相关性越大，反之越小，且具有区域性特点。"}, {"front": "地理信息“空间多样性”对分析结果的解释提出了什么要求？", "back": "分析结果必须依赖于其位置，才能得出合乎逻辑的解释。"}, {"front": "地理信息“空间层次性”在尺度上如何体现？", "back": "不同空间尺度的数据具有不同的空间信息特征。"}, {"front": "按处理对象分类，信息系统可分为空间信息系统和_____。", "back": "非空间信息系统"}, {"front": "在应用层次上，地理信息系统（GIS）属于哪一类系统？", "back": "决策支持系统"}, {"front": "GIS 与其他信息系统在操作对象上的根本区别是什么？", "back": "GIS 的对象是按统一地理坐标编码的空间数据（点、线、面、体）。"}, {"front": "GIS 被誉为地学的第几代语言？", "back": "第三代语言（用数字形式描述空间实体）。"}, {"front": "为什么说 GIS 中的属性信息处理相当于普通的事务性信息处理系统？", "back": "因为属性数据描述的是除空间位置及关系外的定性或定量信息。"}, {"front": "GIS 空间数据管理中，相对于事务性数据，其最显著的物理特征是什么？", "back": "不定长性（如多边形顶点数量不一）。"}, {"front": "地理信息系统海量数据的来源主要包括地理数据本身和_____。", "back": "空间分析过程中不断产生的新空间数据。"}, {"front": "GIS 运行环境的五大部分组成是什么？", "back": "硬件系统、软件系统、空间数据、地学模型、管理与应用人员。"}, {"front": "GIS 软件系统架构从底层到顶层依次是什么？", "back": "GIS 支撑软件、GIS 平台软件、GIS 应用软件。"}, {"front": "操作系统（如 Windows, Linux）和数据库管理系统（如 Oracle）属于 GIS 软件的哪一类？", "back": "GIS 支撑软件"}, {"front": "GIS 平台软件的主要表现形式包括基础应用程序和_____。", "back": "软件开发包（SDK）"}, {"front": "GIS 应用软件与平台软件的关系是什么？", "back": "应用软件是基于平台软件提供的功能和接口，针对行业具体业务需求二次开发而成的。"}, {"front": "在 GIS 数据中，用于表示点、线、面实体之间联系的关系称为什么？", "back": "拓扑关系（Topology）。"}, {"front": "定性属性数据包括名称、类型、特性等，定量属性数据则包括_____。", "back": "数量和等级"}, {"front": "地学模型（Geoscientific Model）在 GIS 中的作用是什么？", "back": "构建能表达或模拟特定现象的计算机模型，为复杂应用提供解决方案。"}, {"front": "GIS 解决的 5 个基本地理问题是什么？", "back": "位置（Location）、条件（Condition）、趋势（Trend）、模式（Pattern）、模拟（Simulation）。"}, {"front": "GIS 的“位置”问题主要通过哪种技术实现？", "back": "空间查询技术"}, {"front": "“符合某些条件的地理对象在哪里”属于 GIS 解决的哪类基本问题？", "back": "条件问题"}, {"front": "“趋势”问题要求 GIS 具备根据历史数据进行哪种分析的能力？", "back": "预测未来和回溯过去。"}, {"front": "GIS 的“模式”问题主要探讨地理实体分布之间的什么？", "back": "空间关系"}, {"front": "GIS 的 6 个基本功能模块包括数据采集、编辑处理、存储管理、分析查询、应用开发和_____。", "back": "数据输出与可视化表达"}, {"front": "目前常用的 GIS 空间数据结构主要有矢量数据结构和_____。", "back": "栅格数据结构"}, {"front": "数据可视化表达中，传递空间信息最有效的工具是什么？", "back": "图形（地图）"}, {"front": "GIS 功能中的“二次开发”通常提供什么支持？", "back": "完整的 API（应用程序接口）和开发环境。"}, {"front": "测量学和遥感技术在 GIS 中扮演的主要角色是什么？", "back": "提供快速、可靠、多时相和廉价的多种信息源。"}, {"front": "GIS 空间分析的理论基础主要由哪门学科提供？", "back": "地理学"}, {"front": "GIS 最初是从哪种技术起步的？", "back": "机助制图（Computer-Aided Cartography）。"}, {"front": "GIS 与数字制图系统的主要区别在于什么？", "back": "深层次的空间分析功能（如缓冲区分析、叠置分析等）。"}, {"front": "相对于 CAD，GIS 在数据处理上的强项是什么？", "back": "属性功能强，能够处理复杂的地理空间自然目标，且具有强大的海量数据图库管理能力。"}, {"front": "遥感图像处理系统强调对栅格数据的几何和灰度处理，而 GIS 更侧重于实体的什么描述？", "back": "空间关系描述及属性查询。"}, {"front": "1998 年由美国副总统戈尔提出的概念是_____。", "back": "数字地球（Digital Earth）"}, {"front": "被称为第三代互联网应用，旨在实现资源全面共享的 GIS 模式是_____。", "back": "网格 GIS（GRID GIS）"}, {"front": "VR GIS 采用哪种主要语言将数据转换到虚拟环境中？", "back": "VRML（虚拟现实建模语言）。"}, {"front": "移动 GIS 实现“4A 服务”指哪四个方面？", "back": "任何地方、任何时间、任何人、任何事 (Anywhere, Anytime, Anyone, Anything)。"}, {"front": "智慧城市建设中，动态获取城市空间物联信息的基础基建是什么？", "back": "物联网（IoT）"}, {"front": "云计算数据中心为 GIS 用户提供的核心价值不再是硬件设备，而是_____。", "back": "计算能力和可用性的各项功能。"}, {"front": "时空大数据相比传统数据，在特征上表现出更强的动态性和_____。", "back": "流动性"}, {"front": "在大数据 GIS 中，哪种计算技术在数据处理和分析环节发挥重要作用？", "back": "并行计算（如 Hadoop, Spark）。"}, {"front": "机器学习相比传统数据挖掘在 GIS 分析中的优势是什么？", "back": "算法带有自调试参数，能通过学习自我完善，提高挖掘和预测的准确性。"}, {"front": "1:5 万与 1:1 万坡度分级数据的差异，体现了地理信息的哪种特性？", "back": "空间尺度上的层次性。"}, {"front": "GIS 的物理外壳是_____。", "back": "计算机化的技术系统"}, {"front": "为什么地理数据库的更新应当是分布式的？", "back": "因为地理信息在区域上表现出分布式特点，且属性表现为多层次。"}], "exercises": [{"question": "关于数据与信息的关系，下列说法正确的是？", "options": {"A": "数据本身就是信息", "B": "信息是数据的载体，数据是信息的表达", "C": "信息是向人们提供现实世界新事实的依据，来源于数据", "D": "数据蕴涵的信息会自动呈现出来"}, "correctAnswer": "C", "explanation": "数据是未经加工的原始资料，是客观对象的表示，其本身并不是信息。信息来源于数据，是数据内涵的意义和对数据内容的解释。数据蕴涵的信息不会自动呈现出来，需要利用技术对其解释。信息是数据的表达，数据是信息的载体。因此，C项表述正确。"}, {"question": "地理实体和地理现象的数据描述标准通常不包括以下哪一部分？", "options": {"A": "空间位置数据", "B": "拓扑结构编码", "C": "属性数据", "D": "时域数据"}, "correctAnswer": "B", "explanation": "地理对象或地理现象的数据描述包括空间位置、属性数据（简称属性）及时域数据三部分。虽然拓扑关系是空间数据的一种类型，但在宏观描述地理数据的三大核心构成时，标准术语为空间位置、属性数据和时域数据。"}, {"question": "“在不同地方或区域上，地理数据的变化趋势是不同的”，这句话深刻体现了地理信息的哪种独特特性？", "options": {"A": "空间相关性", "B": "空间区域性", "C": "空间多样性", "D": "空间层次性"}, "correctAnswer": "C", "explanation": "空间多样性指在不同地方或区域上，地理数据的变化趋势是不同的，这意味着地理信息的分析结果需要依赖于其位置，才能得出合乎逻辑的解释。空间相关性强调距离越近相关性越大；区域性强调天然的分区组织特征；层次性强调多重属性或空间尺度。"}, {"question": "如果根据应用层次对信息系统进行分类，地理信息系统（GIS）属于下列哪种系统？", "options": {"A": "事务处理系统", "B": "空间信息系统", "C": "决策支持系统", "D": "管理信息系统"}, "correctAnswer": "C", "explanation": "在应用层次上，信息系统有事务处理系统、管理信息系统、决策支持系统等系统。地理信息系统在处理对象上属空间信息系统，而在应用层次上则属决策支持系统。"}, {"question": "GIS区别于其它类型普通信息系统的根本标志在于？", "options": {"A": "具有海量数据的压缩管理能力", "B": "能够进行复杂的跨表属性查询", "C": "每一个数据都按统一的地理坐标进行编码，实现定位、定性和定量的描述", "D": "采用了最先进的云计算与并行计算技术"}, "correctAnswer": "C", "explanation": "空间数据的最根本特点是每一个数据都按统一的地理坐标进行编码，实现对其定位、定性和定量的描述，这是GIS区别于其它类型信息系统的根本标志，也是其技术难点之所在。"}, {"question": "在学术界，GIS常被誉为“地学的第三代语言”，这主要是因为它？", "options": {"A": "是地理科学第二次革命的主要工具", "B": "能够用数字形式来描述空间实体", "C": "完美结合了测绘学和遥感技术", "D": "拥有最复杂的拓扑查询语言"}, "correctAnswer": "B", "explanation": "GIS被誉为地学的第三代语言，其核心含义是指它能够用数字形式来描述空间实体。"}, {"question": "在GIS发展历程中，其简称“GIS”中的“S”含义经历了显著演变。当它代表人们日常生活中的大众化应用（如导航软件）时，这个“S”代表的是？", "options": {"A": "System（系统）", "B": "Science（科学）", "C": "Service（服务）", "D": "Society（社会）"}, "correctAnswer": "C", "explanation": "随着互联网技术、计算机技术的普及，地理信息系统已经从单纯的技术型和研究型逐步向地理信息服务层面转移，在这一层面上，“S”一词代表着服务（Service）。"}, {"question": "在GIS系统的五大组成部分中，被形容为GIS的“血液”的是？", "options": {"A": "计算机硬件", "B": "软件系统", "C": "地学模型", "D": "空间数据"}, "correctAnswer": "D", "explanation": "数据是GIS的核心内容，贯穿于GIS的各个过程，有人将它称之为GIS的血液。"}, {"question": "在GIS的各个组成部分中，最为关键和具有能动性因素的是哪一项？", "options": {"A": "处理海量数据的服务器", "B": "高效的空间数据库", "C": "管理与应用人员", "D": "用于空间分析的地学模型"}, "correctAnswer": "C", "explanation": "人是GIS中的重要构成因素。人员是系统建设中的关键和能动性因素，直接影响和协调其它几个组成部分。"}, {"question": "为了解决特定行业复杂的业务问题（如河网提取），GIS引入了哪一组成部分来提供具体的解决方案？", "options": {"A": "关系型数据库系统", "B": "地学模型", "C": "全站仪和GPS设备", "D": "操作系统底座"}, "correctAnswer": "B", "explanation": "模型为GIS应用提供解决方案。地学模型是根据具体的地学目标和问题，以GIS已有的操作和方法为基础，构建能够表达或模拟特定现象的计算机模型。"}, {"question": "空间数据包括三种互相联系的数据类型，用来表示点、线、面实体之间（如相邻、包含）空间联系的数据属于？", "options": {"A": "空间位置数据（几何坐标）", "B": "空间关系数据（拓扑关系）", "C": "属性数据（非几何属性）", "D": "时态数据序列"}, "correctAnswer": "B", "explanation": "实体间的空间相关性即拓扑关系，表示点、线、面实体之间的空间联系，如边界线与面实体间的构成关系，面实体与内部点的包含关系等。"}, {"question": "在GIS软件系统中，像Windows、Linux这样的操作系统，以及Oracle等大型数据库管理系统，被统一归类为？", "options": {"A": "GIS应用软件", "B": "GIS平台软件", "C": "GIS支撑软件", "D": "GIS功能组件包"}, "correctAnswer": "C", "explanation": "GIS支撑软件是指GIS运行所必需的各种软件环境，如操作系统、数据库管理系统、图形处理系统等。"}, {"question": "教材中常将“GIS空间分析”与“GIS应用分析”的关系生动地比喻为？", "options": {"A": "“血液”与“躯体”", "B": "“零件”与“机器”", "C": "“骨骼”与“肌肉”", "D": "“软件”与“硬件”"}, "correctAnswer": "B", "explanation": "GIS空间分析为建立和解决复杂的应用模型提供了基本工具，因此GIS空间分析和应用分析是“零件”和“机器”的关系。用户应用GIS解决实际问题的关键，就是如何将这些零件搭配成解决问题的“机器”。"}, {"question": "GIS可以求解五个基本问题。当需要根据历史数据对地貌未来的发育演变进行分析判断时，这解答的是哪类基本问题？", "options": {"A": "位置问题", "B": "条件问题", "C": "趋势问题", "D": "模式问题"}, "correctAnswer": "C", "explanation": "趋势问题探讨某个地方发生的某个事件及其随时间的变化过程，要求GIS能够对现象的变化过程做出分析判断，并能对未来做出预测和对过去做出回溯。"}, {"question": "由于原始空间数据不可避免含有误差，为了保证数据在一致性和完整性上的逻辑正确，GIS必须具备以下哪种功能？", "options": {"A": "数据采集功能", "B": "数据编辑与处理功能", "C": "空间查询功能", "D": "数据可视化输出功能"}, "correctAnswer": "B", "explanation": "为保证数据在内容、逻辑、数值上的一致性和完整性，需要对数据进行编辑、格式转换、拼接等一系列的处理工作，包括图形编辑、拓扑建立等，这属于数据编辑与处理功能。"}, {"question": "关于空间数据的组织与管理，下列说法中正确的是？", "options": {"A": "一般信息系统的数据结构完全适合直接管理空间数据", "B": "所有的GIS空间数据仅能通过栅格数据结构来存储", "C": "目前有些GIS的图形数据也开始交给扩展了空间功能的商用关系数据库管理系统管理", "D": "空间数据必须与属性数据物理隔离，互不关联"}, "correctAnswer": "C", "explanation": "一般信息系统的数据结构和数据库管理系统并不适合管理空间数据。但目前随着技术发展，有些GIS的图形数据也交给关系数据库管理系统管理，且关系数据库管理系统也在向空间数据管理方面扩展（如Oracle等）。"}, {"question": "作为GIS的分析理论基础，可为GIS提供引导空间分析的方法和观点的学科是？", "options": {"A": "计算机科学", "B": "地图制图学", "C": "地理学", "D": "测量学"}, "correctAnswer": "C", "explanation": "地理学是GIS的分析理论基础，可为GIS提供引导空间分析的方法和观点。"}, {"question": "GIS系统与普通关系数据库管理系统（DBMS）的主要区别体现在？", "options": {"A": "DBMS只能存储图片，不能存储文字", "B": "GIS不仅需要数据管理功能，还需要具有图形数据的采集、可视化和空间分析功能", "C": "DBMS运行速度永远比GIS慢", "D": "GIS只处理单一定长的字符串数据"}, "correctAnswer": "B", "explanation": "地理信息系统除需要功能强大的空间数据的管理功能之外，还需要具有图形数据的采集、空间数据的可视化和空间分析等功能，在功能和软硬件方面比一般事务数据库更复杂。"}, {"question": "许多工程人员将计算机辅助设计（CAD）作为数字制图工具。与GIS相比，CAD系统存在的主要局限性是？", "options": {"A": "CAD无法处理规则的几何图形", "B": "CAD没有坐标参考系统", "C": "CAD属性功能相对较弱，空间分析能力和海量图库管理能力较弱", "D": "CAD无法进行任何数据的输出"}, "correctAnswer": "C", "explanation": "CAD处理的多为规则几何图形，图形功能极强，但属性功能相对较弱。而GIS处理多为复杂的自然与人工目标，具有丰富的属性库和极强的空间分析功能，同时CAD一般仅在单幅图上操作，海量数据的图库管理能力较弱。"}, {"question": "遥感（RS）技术在地理信息系统体系中扮演的最主要角色是？", "options": {"A": "提供所有的拓扑空间分析算法", "B": "作为数据库底层的操作系统软件", "C": "为GIS的数据更新提供丰富、实时、可靠和廉价的多种信息源", "D": "替代GIS直接进行社会经济人口数据的统计与可视化"}, "correctAnswer": "C", "explanation": "测绘学和遥感技术不但为GIS提供快速、可靠、多时相和廉价的多种信息源，而且其获取的影像常进入GIS系统作为背景影像或协同集成分析。"}, {"question": "在20世纪60年代的GIS开拓期，严重制约地理信息系统图形和地学分析功能发展的客观瓶颈是？", "options": {"A": "缺乏地学理论的引导", "B": "测绘人员的数据采集意愿低", "C": "计算机硬件存储能力小且磁带存取速度极慢", "D": "没有任何面向部门的专业需求"}, "correctAnswer": "C", "explanation": "在20世纪60年代的开拓起步阶段，计算机硬件系统的功能还很弱，计算机存储能力很小且磁带存取速度也很慢，极大地制约着地理信息系统的发展。"}, {"question": "在GIS技术的巩固发展期（20世纪70年代），GIS软件技术取得的最重要的进展标志是？", "options": {"A": "人机图形交互技术的发展", "B": "云计算平台的搭建", "C": "自动人工智能影像识别", "D": "移动互联网定位的突破"}, "correctAnswer": "A", "explanation": "在20世纪70年代，由于图形、图像卡等技术的发展增强了人机对话和显示功能，人机图形交互技术的发展成为这一时期软件的最重要进展。"}, {"question": "1998年由美国副总统戈尔提出的，核心思想是用数字化手段统一处理地球问题并嵌入海量多分辨率数据的标志性概念是？", "options": {"A": "物联网GIS", "B": "数字地球", "C": "虚拟现实地球", "D": "智慧城市网格"}, "correctAnswer": "B", "explanation": "1998年美国副总统戈尔提出“数字地球”的概念，其核心思想是用数字化手段统一处理地球问题和最大限度地利用信息资源。"}, {"question": "被称为第三代互联网应用，能够把分布的计算机集群集成在一起，实现空间信息分布式、协作化和智能化处理的技术是？", "options": {"A": "网格GIS（Grid GIS）", "B": "移动GIS（Mobile GIS）", "C": "时态GIS（Temporal GIS）", "D": "互操作GIS（Interoperable GIS）"}, "correctAnswer": "A", "explanation": "网格(Grid)被称为第三代互联网应用，它是把整个互联网整合成一台巨大的超级计算机，基于网格计算的GIS平台，能够分布式、协作化和智能化地处理地理信息。"}, {"question": "能够提供“4A服务”（在任何时间、任何地点为任何人、任何事服务），例如个人位置服务和车辆导航定位的技术形态是？", "options": {"A": "VR GIS", "B": "云 GIS", "C": "移动 GIS", "D": "并行 GIS"}, "correctAnswer": "C", "explanation": "无线通信技术、移动定位技术和WebGIS的结合形成了移动GIS，它可以使地理信息随时、随地、为任何人、任何事进行服务（4A服务）。"}, {"question": "在现代“智慧城市”中，能够通过大量装载在对象上的传感器实时获取动态属性与位置信息，从而极大扩展GIS底层感知网络的技术是？", "options": {"A": "计算机辅助设计(CAD)", "B": "虚拟建模语言(VRML)", "C": "传统纸质地图扫描", "D": "物联网(IoT)"}, "correctAnswer": "D", "explanation": "物联网通过装载在物联对象上的传感器实时、动态地获取信息，这些物联网产生的数据都带有位置和时间信息，促进了GIS的发展并为城市空间物联信息的应用提供基础。"}, {"question": "面临企业级应用海量多源数据的压力，目前改变了计算机为用户提供服务的模式，使得“托管的不再是客户本地设备，而是云端的计算能力”的技术是？", "options": {"A": "桌面端个人关系型数据库", "B": "移动单机导航软件", "C": "云计算与云数据中心", "D": "机助制图系统"}, "correctAnswer": "C", "explanation": "云计算数据中心改变了计算机为用户提供服务的模式，云数据中心中托管的不再是客户的设备，而是计算能力和可用性的各项功能。"}, {"question": "传统的GIS数据管理技术无法应对现今多源、异构的时空大数据。为解决这一难题，在数据处理和分析环节广泛引入的成熟方案是？", "options": {"A": "增加单机的机械硬盘存储", "B": "退回使用手工记录表格", "C": "采用基于Hadoop和Spark等架构的并行计算技术", "D": "仅使用关系型数据库单线程查询"}, "correctAnswer": "C", "explanation": "时空大数据处理与分析是大数据GIS的核心内容，目前基于 Hadoop 和 Spark 等并行计算技术的空间数据处理与管理，是较为成熟并广泛使用的方案之一。"}, {"question": "在处理复杂的时空大数据挖掘时，传统的数据分析难以发现隐含规律。现代GIS正逐步引入哪种前沿算法，使其能够通过自调试参数实现“自我学习”和准确预测？", "options": {"A": "静态几何量算", "B": "固定条件筛选语言 (SQL)", "C": "机器学习与人工智能", "D": "人工拓扑查错"}, "correctAnswer": "C", "explanation": "机器学习的算法不是固定的，而是带有自调试参数，能够随着分析内容和频次的增加，让计算机通过学习自我完善，使挖掘和预测的结果更准确。"}, {"question": "公安部门通过分析特定城市内犯罪几率与该市酒吧、交通、照明等元素的耦合关系，以此提炼出能推广到其他城市的犯罪预警模型。这最主要体现了GIS解决的哪类基本问题？", "options": {"A": "位置问题 (Location)", "B": "趋势问题 (Trend)", "C": "模拟问题 (Simulation)", "D": "条件问题 (Condition)"}, "correctAnswer": "C", "explanation": "模拟即某个地方如果具备某种条件会发生什么问题，是在模式和趋势的基础上，建立现象和因素之间的模型关系。例如研究犯罪几率和周边因素分布的耦合关系，建立通用模型进行未来预测决策。"}]}, {"id": "chapter-2", "title": "第二章：地理空间数学基础", "description": "地球参考、投影、尺度与格网", "cards": [{"front": "地理空间的数学基础主要包括哪三个方面？", "back": "地球空间参考、空间数据投影及坐标转换、空间尺度及地理格网。"}, {"front": "地球表面的几何模型通常分为哪四类？", "back": "地球自然表面、大地水准面、地球椭球面、数学模型。"}, {"front": "什么是“大地水准面”？", "back": "假设海水处于静止平衡状态并延伸到大陆下部，与重力方向处处正交的连续闭合水准面。"}, {"front": "在大地测量和 GIS 应用中，通常选择什么作为地球的理想模型？", "back": "旋转椭球（地球椭球）。"}, {"front": "地球椭球的数学表达式中，参数 $a$ 和 $b$ 分别代表什么？", "back": "$a$ 为长半径（近似赤道半径），$b$ 为极轴半径。"}, {"front": "中国 1980 西安坐标系所采用的参考椭球是什么？", "back": "1975 年国际椭球。"}, {"front": "什么是“椭球定位”？", "back": "依据一定条件，将具有给定参数的椭球与大地体的相关位置确定下来。"}, {"front": "参考定位与绝对定位的主要区别是什么？", "back": "参考定位强调局部符合（如西安 80），绝对定位强调全球符合（如 WGS 84）。"}, {"front": "球面坐标系统主要由哪两个基本参数组成？", "back": "一个地球椭球和一个大地基准面。"}, {"front": "平面坐标系统在包含球面坐标系统参数的基础上，还必须指定什么？", "back": "投影规则（映射关系）。"}, {"front": "天文地理坐标系是以什么为依据建立的？", "back": "大地体（垂线方向）。"}, {"front": "参心空间直角坐标系的原点位于何处？", "back": "参考椭球的中心。"}, {"front": "地心空间直角坐标系的原点位于何处？", "back": "地球质心。"}, {"front": "中国从 2008 年起启用的地心坐标系统简称为什么？", "back": "CGCS2000（2000 国家大地坐标系）。"}, {"front": "在高斯平面直角坐标系中，规定以什么为 $X$ 轴？", "back": "中央经线。"}, {"front": "在高斯平面直角坐标系中，规定以什么为 $Y$ 轴？", "back": "赤道。"}, {"front": "为了避免 $y$ 值出现负值，高斯坐标系规定各投影带的坐标纵轴向西移动多少距离？", "back": "$500\\text{ km}$。"}, {"front": "高斯通用坐标（如 $19\\ 738765.2\\text{ m}$）前两位数字表示什么？", "back": "投影带的编号。"}, {"front": "建立“地方独立平面直角坐标系”的主要目的是什么？", "back": "减小高斯投影产生的长度变形。"}, {"front": "什么是“高程系统”？", "back": "相对于不同性质的参考面（如大地水准面、地球椭球面）所定义的高程体系。"}, {"front": "以地球椭球面为参考面的高程称为什么？", "back": "大地高。"}, {"front": "什么是“深度基准”？", "back": "海图图载水深及其相关要素的起算面。"}, {"front": "深度基准面的选择必须遵循哪两个原则？", "back": "保证航行安全和充分利用航道。"}, {"front": "地图投影的实质是什么？", "back": "建立地面地理坐标 $(B, L)$ 与地图平面坐标 $(X, Y)$ 之间一一对应的函数关系。"}, {"front": "地图投影的变形通常分为哪三种？", "back": "长度变形、面积变形、角度变形。"}, {"front": "长度比 $\\mu$ 的定义是什么？", "back": "投影后的微分线段长度 $ds'$ 与实地长度 $ds$ 之比（$\\mu = \\frac{ds'}{ds}$）。"}, {"front": "若面积比 $P=1$，则该投影属于什么性质的投影？", "back": "等面积投影。"}, {"front": "等角投影又常被称为什么投影？", "back": "正形投影。"}, {"front": "几何投影按辅助投影面的类型可分为哪三类？", "back": "方位投影、圆柱投影、圆锥投影。"}, {"front": "什么是“正轴投影”？", "back": "投影面的中心轴与地轴重合。"}, {"front": "伪圆柱投影的纬线和经线形状有何特征？", "back": "纬线为平行直线，中央经线为直线，其余经线为对称曲线。"}, {"front": "高斯-克吕格投影在投影分类上属于哪种类型？", "back": "横轴等角切圆柱投影。"}, {"front": "高斯投影中，长度变形在何处达到最大？", "back": "边缘处（赤道与带边缘交点）。"}, {"front": "高斯投影 $6^{\\circ}$ 带第 1 带的中央经线是多少度？", "back": "$3^{\\circ}\\text{ E}$。"}, {"front": "中国 $1:1$ 万比例尺地形图采用几度分带？", "back": "$3^{\\circ}$ 分带。"}, {"front": "UTM 投影与高斯投影的主要区别之一是中央经线的长度比，UTM 规定为多少？", "back": "$0.9996$。"}, {"front": "兰勃特等角投影（Lambert）通常属于哪种几何投影？", "back": "正轴等角割圆锥投影。"}, {"front": "中国全图（含南海诸岛插图）常用的投影是什么？", "back": "正轴等面积割圆锥投影（Lambert 投影）。"}, {"front": "在东西延伸的中纬度地区（如中国），一般多采用哪种投影？", "back": "正轴圆锥投影。"}, {"front": "在南北方向延伸的地区（如智利），一般采用什么投影？", "back": "横轴圆柱投影或多圆锥投影。"}, {"front": "同一地理坐标基准下的坐标变换，若无直接解析式，通常采用什么方法？", "back": "间接变换（反算回球面坐标再正算到新投影）。"}, {"front": "多项式拟合变换主要应用于什么情况？", "back": "无法获取参与转换的空间参考投影信息时。"}, {"front": "地图比例尺的数字式表示法举例。", "back": "$1:100000$ 或 $1:10$ 万。"}, {"front": "什么是数字地图中的“无级比例尺”概念？", "back": "数据存储在计算机中，可以根据需要按比例任意缩小或放大，不固定在单一比例尺。"}, {"front": "空间分辨率的定义是什么？", "back": "图像中目标空间细节可分辨的最小尺寸。"}, {"front": "什么是“操作尺度”？", "back": "对空间实体、现象数据进行处理操作时应采用的最佳尺度。"}, {"front": "地理坐标格网（经纬度坐标）的主要缺点是什么？", "back": "实地大小不均匀（高纬度小，低纬度大）。"}, {"front": "直角坐标格网的主要优点是什么？", "back": "实地格网大小均匀。"}], "exercises": [{"question": "地球表面的几何模型中，被称为“重力等位面”的是？", "options": {"A": "固体地球表面", "B": "大地水准面", "C": "地球椭球面", "D": "数学曲面"}, "correctAnswer": "B", "explanation": "A 错误：固体地球表面是极其复杂的不规则曲面，不是重力等位面。B 正确：大地水准面是一个重力等位面，在理论上与静止海平面重合。C 错误：地球椭球面是一个规则的数学曲面，并不是重力等位面。D 错误：数学模型是为了解决特定测量问题而提出的面，如类地形面等。"}, {"question": "1954年北京坐标系采用的参考椭球是？", "options": {"A": "WGS-84椭球", "B": "1975年国际椭球", "C": "克拉索夫斯基椭球", "D": "海福特椭球"}, "correctAnswer": "C", "explanation": "A 错误：WGS-84椭球是1984年创立的，应用于WGS-84坐标系。B 错误：1975年国际椭球被中国1980西安坐标系所采用。C 正确：中国1954年北京坐标系采用的是克拉索夫斯基椭球。D 错误：海福特椭球是中国1953年以前采用的参考椭球。"}, {"question": "确定参考椭球与大地体的位置关系，在大地测量学中称为什么？", "options": {"A": "椭球定位", "B": "投影转换", "C": "高程基准", "D": "空间尺度"}, "correctAnswer": "A", "explanation": "A 正确：指定一个大地基准面将椭球体与大地体联系起来，称为椭球定位。B 错误：投影转换是指空间数据从一种参考系映射到另一种参考系。C 错误：高程基准是推算水准高程的起算依据。D 错误：空间尺度是研究者选择观察世界的窗口。"}, {"question": "下列坐标系中，起算原点与地球质心重合的是？", "options": {"A": "1954年北京坐标系", "B": "1980西安坐标系", "C": "参心空间直角坐标系", "D": "2000国家大地坐标系 (CGCS2000)"}, "correctAnswer": "D", "explanation": "A 错误：北京54属于参心坐标系，原点不与地球质心重合。B 错误：西安80也属于参心坐标系，原点设在椭球中心。C 错误：参心坐标系原点位于参考椭球中心，不与质心重合。D 正确：CGCS2000属于地心坐标系统，起算原点和地球质心重合。"}, {"question": "天文地理坐标系是以什么为坐标原点的？", "options": {"A": "参考椭球中心", "B": "地心（地球质量中心）", "C": "赤道与中央经线交点", "D": "格林尼治天文台"}, "correctAnswer": "B", "explanation": "A 错误：参考椭球中心是参心空间直角坐标系的原点。B 正确：天文地理坐标系以地心为坐标原点。C 错误：赤道与中央经线交点是高斯平面直角坐标系的原点。D 错误：格林尼治天文台用于定义天文首子午面，并非坐标原点。"}, {"question": "为了避免y值出现负值，高斯平面直角坐标系规定各投影带的坐标纵轴应如何平移？", "options": {"A": "东移500km", "B": "西移500km", "C": "东移500m", "D": "西移500m"}, "correctAnswer": "B", "explanation": "A 错误：东移会使得中央经线以西区域的y值仍然为负。B 正确：规定纵轴均西移500km，使得原横坐标值由0变为500km，以避免负值。C 错误：平移单位是公里(km)，且方向为西移。D 错误：平移单位是公里(km)，不是米(m)。"}, {"question": "若某点位于第19带，横坐标西移前为238765.2m，则其通用横坐标表示为？", "options": {"A": "738765.2m", "B": "19238765.2m", "C": "19738765.2m", "D": "19500000m"}, "correctAnswer": "C", "explanation": "A 错误：738765.2m是西移后的横坐标，但未加带号无法区分不同投影带。B 错误：该值仅加上了带号，没有加上西移的500000m。C 正确：西移后横坐标为738765.2m，在前面加上带号19，即19738765.2m。D 错误：这是直接用带号拼接500km的错误形式。"}, {"question": "建立地方独立直角坐标系时，地方参考椭球的半径会随什么参数而增大？", "options": {"A": "经度差异", "B": "纬度变化", "C": "当地平均海拔高程和高程异常", "D": "中央子午线偏移量"}, "correctAnswer": "C", "explanation": "A 错误：地方参考椭球半径变化与经度差异无关。B 错误：参考椭球半径增大与纬度变化无关。C 正确：其椭球半径增大量与当地平均海拔高程及平均高程异常有关。D 错误：中央子午线选取用于投影面确定，不改变椭球半径公式。"}, {"question": "1985国家高程基准面是通过哪个验潮站的资料确定的？", "options": {"A": "废黄河验潮站", "B": "坎门验潮站", "C": "大连验潮站", "D": "青岛大港验潮站"}, "correctAnswer": "D", "explanation": "A 错误：我国曾使用过废黄河高程基准，但不是1985国家基准。B 错误：坎门高程基准是我国以前使用过的高程基准之一。C 错误：大连高程基准也是以前使用过的基准。D 正确：基准面为青岛大港验潮站1952－1979年资料确定的黄海平均海面。"}, {"question": "在海图中，所谓的“图载水深”指的是哪两面之间的距离？", "options": {"A": "深度基准面至海底", "B": "平均海面至海底", "C": "大地水准面至海底", "D": "最高潮面至海底"}, "correctAnswer": "A", "explanation": "A 正确：图载水深是该深度基准面至海底的距离。B 错误：平均海面向下一定深度才是深度基准面。C 错误：水深的起算面是深度基准面，而非大地水准面。D 错误：深度基准常位于海面以下较低位置以保证航行安全，与最高潮面无关。"}, {"question": "用符号Vμ表示长度变形，当Vμ<0时，表示？", "options": {"A": "投影后长度没有变形", "B": "投影后长度缩小", "C": "投影后长度增加", "D": "投影后长度成倍放大"}, "correctAnswer": "B", "explanation": "A 错误：Vμ=0时，投影后长度才没有变形。B 正确：当Vμ<0时，表示投影后长度缩小。C 错误：当Vμ>0时，表示投影后长度增加。D 错误：Vμ<0表示缩小变形，不是放大。"}, {"question": "在投影变形椭圆中，如果长半轴a与短半轴b相等（a=b），则该投影属于？", "options": {"A": "等距投影", "B": "等积投影", "C": "等角投影", "D": "任意投影"}, "correctAnswer": "C", "explanation": "A 错误：等距离投影的变形椭圆某一半轴与微分圆半径相等（如b=r）。B 错误：等面积投影的变形椭圆特征是a·b=r²。C 正确：如果投影后为大小不同的圆形（a=b），则该投影为等角投影。D 错误：任意投影的面积不等且形状各异。"}, {"question": "按照投影面与地球自转轴的关系，投影面中心轴与地轴相互垂直的投影称为？", "options": {"A": "正轴投影", "B": "横轴投影", "C": "斜轴投影", "D": "割投影"}, "correctAnswer": "B", "explanation": "A 错误：正轴投影的中心轴与地轴重合。B 正确：横轴投影的投影面中心轴与地轴相互垂直。C 错误：斜轴投影的中心轴与地轴斜交。D 错误：割投影是按投影面与地球表面相割关系划分的。"}, {"question": "高斯—克吕格投影按照构成方法属于哪种投影？", "options": {"A": "横轴等角切圆柱投影", "B": "正轴等角切圆柱投影", "C": "正轴等积割圆锥投影", "D": "斜轴等距离方位投影"}, "correctAnswer": "A", "explanation": "A 正确：在投影分类中，高斯投影是横轴等角切圆柱投影。B 错误：高斯投影是横轴而非正轴。C 错误：高斯投影使用圆柱面而非圆锥面。D 错误：高斯投影不属于方位投影。"}, {"question": "高斯投影的变形特征之一是，在同一条经线上？", "options": {"A": "长度变形随纬度降低而增大，赤道处最大", "B": "长度变形随纬度升高而增大，两极处最大", "C": "长度没有变形", "D": "长度变形恒定不变"}, "correctAnswer": "A", "explanation": "A 正确：高斯投影在同一条经线上，长度变形随纬度降低而增大，赤道处最大。B 错误：变形并非在两极处最大。C 错误：除中央经线外，其他经线上均存在变形。D 错误：长度变形随经纬度位置而改变。"}, {"question": "高斯投影6°带的划分标准是？", "options": {"A": "自东经1°30'开始，每隔6°为一带", "B": "从0度子午线起，自西向东每隔经差6°为一带", "C": "从西经180°由西向东每隔6°为一带", "D": "从本初子午线起，自东向西每隔6°为一带"}, "correctAnswer": "B", "explanation": "A 错误：自东经1°30'开始是3°带的划分标准。B 正确：6°带是从0度子午线起，自西向东每隔经差6°为一投影带。C 错误：这是UTM投影的带号编号起点。D 错误：划分方向应为自西向东。"}, {"question": "通用横轴墨卡托投影（UTM）规定中央经线长度比为多少？", "options": {"A": "1.0000", "B": "0.9996", "C": "1.0004", "D": "0.9990"}, "correctAnswer": "B", "explanation": "A 错误：中央经线长度比为1是高斯投影的规定。B 正确：UTM投影规定中央经线长度比为0.9996。C 错误：与标准参数不符。D 错误：与标准参数不符。"}, {"question": "我国1:10万比例尺地形图均采用什么投影？", "options": {"A": "UTM投影", "B": "兰勃特投影", "C": "高斯投影", "D": "墨卡托投影"}, "correctAnswer": "C", "explanation": "A 错误：我国基本比例尺系统不采用UTM投影。B 错误：兰勃特投影常用于中国全图或分省图。C 正确：我国规定1:10万比例尺地形图等均采用高斯投影。D 错误：墨卡托投影主要用于航线图等。"}, {"question": "在不同地理坐标基准间的转换（如WGS84到西安80）中，用于空间直角坐标基准转换的模型是？", "options": {"A": "纯数值多项式拟合", "B": "七参数或简化三参数法", "C": "直接高斯投影正算", "D": "查表插值法"}, "correctAnswer": "B", "explanation": "A 错误：多项式拟合适用于无法获取投影信息的单纯数值变换。B 正确：空间直角坐标基准转换利用七参数或三参数法实现参考椭球转换。C 错误：高斯投影公式仅用于大地坐标转平面直角坐标。D 错误：教材并未将查表插值法列为基准转换手段。"}, {"question": "多项式拟合变换属于哪种坐标转换方法？", "options": {"A": "投影解析转换", "B": "数值—解析变换", "C": "单纯数值变换", "D": "七参数转换"}, "correctAnswer": "C", "explanation": "A 错误：投影解析转换需要存在直接的解析公式。B 错误：数值—解析变换是先数值逼近再代入解析式的方法。C 正确：若无法获取投影信息，可采用多项式拟合这种单纯数值变换法。D 错误：七参数是包含平移、旋转及尺度的三维解析转换。"}, {"question": "遥感仪器所能分辨的最小地面物体大小，称为？", "options": {"A": "光谱分辨率", "B": "图像分辨率", "C": "地面像元分辨率", "D": "时间分辨率"}, "correctAnswer": "C", "explanation": "A 错误：光谱分辨率是对图像光谱细节分辨能力的度量。B 错误：图像分辨率是成像细节分辨能力的宏观统称。C 正确：地面像元分辨率是遥感仪器所能分辨的最小地面物体大小。D 错误：时间分辨率是序列图像成像的时间间隔。"}, {"question": "数字图像的空间分辨率通过什么指标来严谨表达？", "options": {"A": "像元的总数量", "B": "图像文件的大小", "C": "像元的光谱通道数", "D": "离散像元所能分辨的最小尺寸或两点间最小距离"}, "correctAnswer": "D", "explanation": "A 错误：像元总数决定幅面而非空间分辨率。B 错误：文件大小与分辨率无绝对等价关系。C 错误：光谱通道与光谱分辨率有关。D 正确：数字图像的空间分辨率应通过离散像元间所能分辨的最小尺寸或最小距离表达。"}, {"question": "在空间尺度分析中，“操作尺度”主要影响的是？", "options": {"A": "卫星影像成像时间", "B": "数据处理操作与分析结果的可靠程度", "C": "地图投影变形的计算", "D": "高程基准的确立"}, "correctAnswer": "B", "explanation": "A 错误：成像时间概念对应时间分辨率。B 正确：操作尺度是对数据处理时应采用的最佳尺度，影响处理结果可靠度。C 错误：投影变形由数学法则决定，独立于操作尺度。D 错误：高程基准由长期验潮数据推算决定。"}, {"question": "国家标准《地理格网》(GB/T 12409-2009)确立了哪两种并存的格网划分体系？", "options": {"A": "高斯格网和UTM格网", "B": "地理坐标格网和直角坐标格网", "C": "像素格网和矢量格网", "D": "行政格网和自然格网"}, "correctAnswer": "B", "explanation": "A 错误：虽然有高斯坐标格网，但对应体系是直角坐标体系。B 正确：标准确认了“地理坐标格网”和“直角坐标格网”两种体系并存。C 错误：这是数据模型概念，非标准定位体系。D 错误：行政/自然是区域划分标准，并非此格网划分的数学体系。"}, {"question": "地理坐标格网（经纬格网）体系的优点之一是？", "options": {"A": "对应的实地大小非常均匀", "B": "便于进行大区域乃至全球性的拼接", "C": "不会产生任何地图投影变形", "D": "随投影系统的改变而改变位置"}, "correctAnswer": "B", "explanation": "A 错误：由于经线收敛，地理坐标格网在实地大小不均匀（高纬度较小）。B 正确：地理坐标格网便于进行大区域乃至全球性的拼接。C 错误：投影到平面必然有变形。D 错误：直角坐标格网才随投影选择改变位置，地理坐标格网不随投影系统改变位置。"}, {"question": "我国基本比例尺地图是以哪种比例尺地形图分幅为基础的？", "options": {"A": "1:1万", "B": "1:5万", "C": "1:10万", "D": "1:100万"}, "correctAnswer": "D", "explanation": "A、B、C 错误：它们都是基于基础比例尺派生的图幅。D 正确：我国基本比例尺地形图均以1:100万地形图为基础，按经差纬差划分。"}]}, {"id": "chapter-3", "title": "第三章：空间数据模型", "description": "空间实体、关系、场与数据模型", "cards": [{"front": "地理学中，地理空间（geographic space）通常指什么范围？", "back": "地球表面及近地表空间。"}, {"front": "空间实体具有哪四个基本特征？", "back": "空间位置特征、属性特征、时间特征和空间关系特征。"}, {"front": "空间实体的_____也称为几何特征，包括其位置、大小、形状和分布状况。", "back": "空间位置特征"}, {"front": "空间实体的_____特征也称为非空间特征或专题特征。", "back": "属性"}, {"front": "空间实体的属性通常分为定性属性（如名称）和_____属性（如数量、等级）。", "back": "定量"}, {"front": "地理空间中实体之间密切联系的特性称为什么？", "back": "空间关系"}, {"front": "空间关系主要包括拓扑关系、度量关系和_____关系。", "back": "顺序"}, {"front": "在GIS抽象过程中，哪一个层次是系统抽象的最高层？", "back": "概念模型（Conceptual Model）"}, {"front": "哪种数据模型是概念模型向物理模型转换的桥梁，通常指空间数据的逻辑结构？", "back": "逻辑数据模型"}, {"front": "_____模型是概念模型在计算机内部具体的存储形式和操作机制，涉及磁盘存放。", "back": "物理数据模型"}, {"front": "将整个地理空间看作空域，其中的地理现象作为独立对象分布，这种模型称为_____模型。", "back": "对象（要素）"}, {"front": "对象模型通常将空间特征划分为哪四种基本形式？", "back": "点、线、面、体。"}, {"front": "哪种概念模型适合描述大气污染、地表温度、地形高度等连续变化的现象？", "back": "场模型（Field Model）"}, {"front": "二维场模型在数学上通常表示为函数 $A = f(x, y)$，其中 $x, y$ 代表什么？", "back": "空间位置坐标"}, {"front": "在场数据模型中，不规则三角形区（TIN）任意位置的属性值通常通过什么方法得到？", "back": "线性内插"}, {"front": "场数据模型中，将平面划分为间距相等的矩形单元进行属性记录的方式称为_____。", "back": "规则格网（Grid）"}, {"front": "网络模型与对象模型的主要区别在于它强调地理对象之间的_____。", "back": "交互作用（或连通情况）"}, {"front": "时空数据模型主要用于表达地理现象随时间变化的动态过程，其三个基本要素是_____。", "back": "空间、时间和属性"}, {"front": "时间地理学中，用于定量表达活动个体行为轨迹的模型是_____。", "back": "时空棱柱（Space-time prism）"}, {"front": "时空立方体（Space-time cube）模型属于_____型时空数据模型。", "back": "连续"}, {"front": "在GIS中，如果地理现象随坐标 $x, y, h$（高程）和 $t$（时间）四个变量变化，需构建_____模型。", "back": "四维数据"}, {"front": "对于现状不定的现象（如火灾、洪水扩散），通常首选哪种概念模型进行建模？", "back": "场模型"}, {"front": "在面向对象模型中，将具有相同属性和方法的实体归类抽象的过程称为_____。", "back": "分类（Classification）"}, {"front": "“概括”（Generalization）是将多个类进一步抽象为_____的过程。", "back": "超类（Super-class）"}, {"front": "面向对象技术中，强制性地将子对象的属性信息传递给复杂对象的工具称为_____。", "back": "传播（Propagation）"}, {"front": "几何图形数据中，连接两个结点的线段通常称为_____或链（link）。", "back": "弧段（arc）"}, {"front": "在二维平面上，点 $P$ 存储为 $(x, y)$；若含有高程信息则存储为 $(x, y, z)$，后者称为_____要素。", "back": "三维点"}, {"front": "矢量数据的基本结构类型中，面（Area）属于几维数据？", "back": "二维数据"}, {"front": "像素数据的最小分割单元通常称为什么？", "back": "像元（Pixel）"}, {"front": "影像数据的空间分辨率是指像元大小所对应的_____。", "back": "地面覆盖面积尺寸"}, {"front": "对于影像数据，分辨率越高（像元越小），显示的细节越_____。", "back": "多（或详细）"}, {"front": "为什么地图比例尺变大不代表分辨率提高？", "back": "因为实际像元代表的地面覆盖面积（像元大小）并未改变。"}, {"front": "在确定栅格单元值时，取像元几何中心点的值作为该单元属性的方法称为_____。", "back": "中心点取值法"}, {"front": "拓扑关系中的“邻接关系”是指哪类元素之间的关系？", "back": "同类元素（如多边形与多边形）"}, {"front": "拓扑关系中的“关联关系”是指哪类元素之间的关系？", "back": "不同类元素（如结点与弧段）"}, {"front": "拓扑空间关系中，描述一个实体完全处于另一个实体内部的关系是_____。", "back": "包含（或包含于/覆盖）"}, {"front": "在空间数据拓扑关系表中，弧段的“左邻面”和“右邻面”是如何确定的？", "back": "沿弧段前进方向确定"}, {"front": "点实体与面实体之间可能存在哪三种拓扑关系？", "back": "相邻、相离、包含。"}, {"front": "描述实体间东南西北方位关系的空间关系属于_____空间关系。", "back": "顺序"}, {"front": "描述空间实体之间距离远近的关系属于_____空间关系。", "back": "度量"}, {"front": "哪种对象抽象技术将属于同一类的若干对象组合成新的集合，表现为“is member of”关系？", "back": "联合（Association）"}, {"front": "在GIS中，通常使用哪种图形建模语言来表达数据逻辑模型？", "back": "UML（统一建模语言）"}, {"front": "封闭的多面体（Multipatch）主要用于表示哪种地理对象？", "back": "三维地理对象（如建筑物、道路体）"}, {"front": "空间数据类型中，关于数据的数据（如来源、精度、比例尺等）称为什么？", "back": "元数据（Metadata）"}, {"front": "在场模型表示方法中，等值线中间区域的属性值是如何确定的？", "back": "通过两条等值线的连续插值。"}, {"front": "矢量数据的构建基础是什么？", "back": "点的位置及其序列关系。"}, {"front": "在城市地籍管理中，将宗地边界与内部建筑物聚集为“宗地”类，这体现了哪种建模思想？", "back": "面向对象建模（或聚集技术）"}], "exercises": [{"question": "地理空间数据模型可以归纳为哪三个层次？", "options": {"A": "概念模型、逻辑模型、数学模型", "B": "概念数据模型、逻辑数据模型、物理数据模型", "C": "对象模型、场模型、网络模型", "D": "矢量数据模型、栅格数据模型、拓扑模型"}, "correctAnswer": "B", "explanation": "A项错误，空间数据模型不包括数学模型，抽象的第三个层次应为物理数据模型。B项正确，对现实世界抽象建模得到空间数据模型，其可归纳为概念数据模型、逻辑数据模型和物理数据模型三个层次。C项错误，对象模型、场模型和网络模型是具体的概念数据模型，不能代表抽象的三个层次。D项错误，矢量和栅格属于底层数据结构的表达，不是系统抽象的层次。"}, {"question": "以下哪项不是地理空间实体的四个基本特征之一？", "options": {"A": "空间位置特征", "B": "属性特征", "C": "空间关系特征", "D": "数据结构特征"}, "correctAnswer": "D", "explanation": "A项错误，空间位置特征（几何特征）是四大基本特征之一。B项错误，属性特征（非空间特征）也是实体的基本特征。C项错误，空间关系特征属于实体的四大基本特征之一。D项正确，空间实体具有4个基本特征，即空间位置特征、属性特征、时间特征和空间关系特征，并不包括数据结构特征。"}, {"question": "地理信息系统描述空间抽象过程的最高层次是？", "options": {"A": "概念模型", "B": "逻辑模型", "C": "物理模型", "D": "网络模型"}, "correctAnswer": "A", "explanation": "A项正确，概念模型是地理数据的语义解释，从计算机系统角度看是系统抽象的最高层。B项错误，逻辑模型是系统抽象的中间层。C项错误，物理模型是系统抽象的最底层。D项错误，网络模型属于具体的概念模型类型之一。"}, {"question": "适合用于对具有明确边界的离散地理现象（如建筑物、道路）进行建模的是？", "options": {"A": "场模型", "B": "时空立方体模型", "C": "对象模型", "D": "像素数据模型"}, "correctAnswer": "C", "explanation": "A项错误，场模型用于连续变量的表达。B项错误，时空立方体处理带有时间维度的动态变化。C项正确，对象模型把现象作为独立的对象，一般适合于具有明确边界和离散地理现象的建模，如建筑物和道路。D项错误，像素数据（影像）主要反映地表的栅格覆盖情况，非针对离散对象的专门逻辑。"}, {"question": "把地理空间现象作为连续的变量或体来看待的数据模型是？", "options": {"A": "对象模型", "B": "场模型", "C": "网络模型", "D": "时空模型"}, "correctAnswer": "B", "explanation": "A项错误，对象模型处理独立分布的空域对象。B项正确，场模型把地理空间中的现象作为连续的变量或体来看待，如大气污染和地表温度等。C项错误，网络模型强调多地理现象之间的连通情况。D项错误，时空模型重点处理随时间变化的过程。"}, {"question": "不属于二维场数据模型常用具体表示方法的是？", "options": {"A": "等值线", "B": "不规则分布的点", "C": "拓扑相交连通链", "D": "规则矩形区（格网单元）"}, "correctAnswer": "C", "explanation": "A项错误，等值线是场模型表征连续插值的常用表示方法。B项错误，不规则分布的点通过空间内插求得属性，属于常用场模型。C项正确，二维场模型通常有6种描述形式，拓扑连通链多属于网络或对象模型，不在此列。D项错误，规则矩形区即格网单元，是场模型的典型描述方式。"}, {"question": "与对象模型在描述不连续现象上相似，但更需要考虑地理现象之间连通情况与交互作用的模型是？", "options": {"A": "场模型", "B": "多维数据模型", "C": "网络模型", "D": "影像数据模型"}, "correctAnswer": "C", "explanation": "A项错误，场模型主要描述连续现象。B项错误，多维模型侧重于多于两个属性维度的变化。C项正确，网络模型描述不连续地理现象，但不同之处在于它需考虑通道相互连接的多个地理现象的连通情况与交互作用。D项错误，影像数据属于栅格像素数据表示。"}, {"question": "某地出租车乘客的上下车位置存在多种可能，且该位置的乘客数量也不确定，这属于时空模型的哪种变化形式？", "options": {"A": "属性不变而空间位置发生变化", "B": "空间位置和属性同时变化", "C": "属性随时间变化而位置不变", "D": "时间属性固化而空间维度增加"}, "correctAnswer": "B", "explanation": "A项错误，这属于个人普通出行轨迹的特征。B项正确，出租车乘客上下车位置可能变化，且乘客数量（属性）不定，属于空间位置和属性均变化的形式。C项错误，这是固定地铁站点刷卡人数变动的特征。D项错误，资料未提到该种时空变化形式。"}, {"question": "属于连续型时空数据模型的是？", "options": {"A": "时空立方体模型", "B": "序列快照模型", "C": "时空棱柱模型", "D": "拓扑空间模型"}, "correctAnswer": "A", "explanation": "A项正确，时空立方体模型以三维空间为基础并以Z轴表示时间，在任何位置时间都能找到对应单元，属于连续型时空数据模型。B项错误，序列快照是常用表达形式，未指出其具备连续多面体特性。C项错误，基于时空棱柱的数据模型仅对移动对象轨迹表达，属于离散型时空数据模型。D项错误，拓扑模型反映相邻关系，不是时空模型。"}, {"question": "若研究区域内的温度随时间变化，且同时随海拔高度两个变量发生变化，通常需要使用几维模型表达？", "options": {"A": "二维模型", "B": "三维模型", "C": "四维模型", "D": "五维模型"}, "correctAnswer": "C", "explanation": "A项错误，二维无法体现时间和高程。B项错误，仅随时间或仅随高程变化之一时构建三维即可。C项正确，若温度表达式为Tem=F(x, y, h, t)，包含了XY二维空间、高程h和时间t四个变量，这就需要构建四维模型。D项错误，四变量对应四维，不需要五维。"}, {"question": "实现空间数据概念模型到物理模型转换的桥梁是？", "options": {"A": "数学模型", "B": "逻辑数据模型", "C": "面向对象程序", "D": "UML语言"}, "correctAnswer": "B", "explanation": "A项错误，空间数据模型中不包括数学模型抽象层。B项正确，空间逻辑数据模型是实现空间数据概念模型到空间数据物理模型的桥梁。C项错误，面向对象仅是实现逻辑模型的方法之一。D项错误，UML是表示模型设计的方法工具，非概念桥梁本身。"}, {"question": "提取建筑物的高度和面积等属性信息，以用于城市规划，这在空间数据逻辑建模中属于？", "options": {"A": "实体属性的逻辑建模", "B": "实体关系的逻辑建模", "C": "实体行为的逻辑建模", "D": "网络拓扑建模"}, "correctAnswer": "A", "explanation": "A项正确，对地理实体的非空间属性（高度、面积）进行提取和抽象，属于实体属性的逻辑建模。B项错误，关系建模涉及多个对象之间的关联，如一对多。C项错误，行为建模定义实体的运行规则。D项错误，网络拓扑用于分析路径连通。"}, {"question": "在一般关系的逻辑建模中，农户与多个宗地之间的关系属于？", "options": {"A": "一对一关系", "B": "多对多关系", "C": "一对多关系", "D": "拓扑关系"}, "correctAnswer": "C", "explanation": "A项错误，一个农户可拥有多个地块。B项错误，农户和居住区才是多对多关系。C项正确，一个农户可以有多个地块，但一个地块只能属于一个农户，这是典型的一对多关系。D项错误，这属于一般关系，不涉及几何拓扑关联。"}, {"question": "约束“某条道路只能向北单行”，这属于空间逻辑数据建模的哪一类？", "options": {"A": "实体属性的逻辑建模", "B": "实体关系的逻辑建模", "C": "实体行为的逻辑建模", "D": "几何特征的逻辑建模"}, "correctAnswer": "C", "explanation": "A项错误，属性建模侧重于非空间静态数值如高度。B项错误，关系建模侧重于对象所有权和从属。C项正确，定义实体交互规则与复杂限制条件（如道路单行、污染物随风向扩散）属于实体行为的逻辑建模。D项错误，几何类型决定建筑物是用点还是面表示，与单行限制无关。"}, {"question": "面向对象方法中，把一组属于不同类中的若干对象组合起来，形成一个更高级别的复合对象（如宗地）的过程称为？", "options": {"A": "概括", "B": "聚集", "C": "联合", "D": "分类"}, "correctAnswer": "B", "explanation": "A项错误，概括是将具有相同属性的类抽象为超类。B项正确，聚集是把不同类对象组合成复合对象，如将地籍权属界线与内部建筑物聚集为“宗地”类。C项错误，联合是对同一类中的具体对象进行合并。D项错误，分类是相同对象的归类。"}, {"question": "饭店类因为是建筑物类的子类，因而直接获得了房屋主、地址等属性，这利用了面向对象技术的什么语义工具？", "options": {"A": "多方继承", "B": "传播", "C": "单一继承", "D": "联合"}, "correctAnswer": "C", "explanation": "A项错误，饭店直接继承自唯一的建筑物超类，并非多方继承。B项错误，传播是从子对象提取位置信息强制给父对象的工具。C项正确，饭店类作为建筑物的子类，继承这些共有的属性和操作，这属于服务于概括的继承工具。D项错误，联合是相同类的对象合并。"}, {"question": "“运河”作为“人工交通线”和“河流”的共同子类，同时继承两者的方法，这在面向对象逻辑模型中称为？", "options": {"A": "聚集", "B": "传播", "C": "单一继承", "D": "多方继承"}, "correctAnswer": "D", "explanation": "A项错误，聚集是构成复杂实体的过程。B项错误，传播是提取坐标属性。C项错误，单一继承只有一个直接父类。D项正确，运河允许多于一个直接父类，同时继承“交通线”和“水系”的属性方法，被称为多方继承。"}, {"question": "为了保证数据库一致性，多边形的位置坐标不直接表达，而是从其构成的弧段和结点中提取，这种面向对象的语义手段叫？", "options": {"A": "传播", "B": "联合", "C": "封装", "D": "概括"}, "correctAnswer": "A", "explanation": "A项正确，传播是一种强制性的手段，使复杂对象的属性不单独描述，而是从子对象中提取，以此保证数据库一致性。B项错误，联合是将对象合并。C项错误，封装是隐藏方法内部实现。D项错误，概括是产生超类。"}, {"question": "矢量空间几何图形数据中，最为基本、并可用来构建其它所有类型几何图形要素的数据类型是？", "options": {"A": "面", "B": "线", "C": "点", "D": "体"}, "correctAnswer": "C", "explanation": "A、B、D项错误，线由点连成，面由闭合线构成，体由面构建。C项正确，在空间几何图形数据中，点是最为基本的几何图形要素，其它类型的几何图形要素都是基于点数据构建。"}, {"question": "三维矢量线要素的构建，在本质上是由什么决定的？", "options": {"A": "线条的长度和连接顺序", "B": "点的高程属性及点的序列关系", "C": "三维多边形的相交特性", "D": "像素单元的体积大小"}, "correctAnswer": "B", "explanation": "A项错误，缺乏对高程维度构成的解释。B项正确，观察二三维特征可发现，三维线的构建本质上是由点的高程属性及点的序列关系所决定的。C项错误，线不依赖于多边形而存在。D项错误，像素是栅格数据特征。"}, {"question": "关于影像数据（像素数据）空间分辨率的说法，哪项是正确的？", "options": {"A": "像元越小，空间分辨率一定越高", "B": "空间分辨率仅由影像的显示比例尺决定", "C": "栅格数据的空间分辨率是由其比例尺和像元的分辨率共同决定的", "D": "像元大小会随着显示器上的放大操作而实际改变"}, "correctAnswer": "C", "explanation": "A项错误，分辨率不单取决于像元极小，还受比例尺影响。B项错误，仅仅比例尺不足以决定。C项正确，影像像元越小不等于分辨率越高，栅格数据的空间分辨率是由其比例尺和像元的分辨率共同决定的。D项错误，像元在地面上实际覆盖的尺寸并不会因显示放大或缩小而改变。"}, {"question": "当栅格单元中出现多个地物时，决定该栅格单元属性值的原则是什么？", "options": {"A": "永远取左上角像素点的值", "B": "永远取最小地物的值", "C": "尽量保持其真实性，如取中心点或整体区域取值", "D": "随机取平均值"}, "correctAnswer": "C", "explanation": "A项错误，无此选取方法。B项错误，无强制取最小地物值的规定。C项正确，决定栅格单元值时应尽量保持其真实性，常用的方法包括取像元中心点或从整体区域取值。D项错误，不随机取平均值。"}, {"question": "在空间图形保持连续状态的变形（如橡皮拉伸）中，哪种空间关系能保持不变？", "options": {"A": "形状大小关系", "B": "顺序空间关系", "C": "度量空间关系", "D": "拓扑空间关系"}, "correctAnswer": "D", "explanation": "A项错误，形状和大小会随图形的变形而改变。B项错误，顺序关系方位可能会改变。C项错误，度量距离会随着拉伸改变。D项正确，地图上的拓扑关系是指图形在变形时，其邻接、包含等图形关系保持不变的性质。"}, {"question": "在拓扑空间关系中，结点与弧段之间的关联关系属于？", "options": {"A": "邻接关系", "B": "连通关系", "C": "包含关系", "D": "关联关系"}, "correctAnswer": "D", "explanation": "A项错误，邻接属于同类元素间的关系。B项错误，连通属于弧段与弧段之间的关系。C项错误，包含强调不同级别如多边形内有岛。D项正确，不同类元素（如结点和弧段，或者弧段和多边形）之间的拓扑关系称为关联关系。"}, {"question": "两个分离的实体变压器和电线杆，在投影至平面上时正好位置一致，这属于点－点实体的哪种空间关系？", "options": {"A": "相邻", "B": "重合", "C": "相交", "D": "包含"}, "correctAnswer": "B", "explanation": "A项错误，点点之间没有相邻关系。B项正确，点实体和点实体之间只存在相离和重合两种关系，投影到一点即重合关系。C项错误，点与点没有相交关系。D项错误，点与点没有包含关系。"}, {"question": "供水主干管道与次干管道相连，这属于线实体与线实体的什么空间关系？", "options": {"A": "相邻（连通）", "B": "相离", "C": "包含", "D": "重合"}, "correctAnswer": "A", "explanation": "A项正确，线实体与线实体间供水主干与次干管道这种连接属于相邻（连通）关系。B项错误，管道连通并不是分离的。C项错误，次干并非包含于主干内。D项错误，并未占据完全一样的坐标路径。"}, {"question": "下列关于“度量空间关系”的描述，错误的是？", "options": {"A": "主要指空间实体间的距离关系", "B": "可以按欧几里德距离进行定量计算", "C": "它是一种极其稳定的关系，不随投影和几何变换而改变", "D": "可以应用“远近”等概念进行定性描述"}, "correctAnswer": "C", "explanation": "A项错误，此描述正确，度量指距离关系。B项错误，此描述正确，可用欧式距离定量。C项正确，距离值和顺序关系类似，会随投影和几何变换而变化，因而不是稳定的。D项错误，此描述正确，可用“远近”定性描述。"}, {"question": "从概念建模的角度，采用分段函数给各坐标点映射一个恒定取值，从而对带有不同林分覆盖的森林建模，属于什么观点？", "options": {"A": "对象模型", "B": "时空模型", "C": "场模型", "D": "网络模型"}, "correctAnswer": "C", "explanation": "A项错误，对象模型是直接定义界限得到多边形边界的方法。B项错误，未涉及随时间推演的过程。C项正确，将森林建模为分段函数并映射至各点属性的方法，体现了场模型把现象当连续变量的观点。D项错误，与路径分析无关。"}, {"question": "在遥感领域，利用卫星和飞机上的传感器收集地表数据时，占据主导地位的概念模型是？", "options": {"A": "网络模型", "B": "场模型", "C": "对象模型", "D": "UML模型"}, "correctAnswer": "B", "explanation": "A项错误，网络模型不适合广泛连续覆盖。B项正确，遥感领域主要利用传感器收集地表连续变化数据，此时场模型是占主导地位的。C项错误，对象模型主要应用于明确边界如道路和地块等。D项错误，UML属于逻辑设计方法。"}, {"question": "在处理空间数据逻辑模型的顺序关系（如上下左右方位）时，当前GIS系统的通常做法是？", "options": {"A": "通过建立强大的几何计算引擎完美重构", "B": "将其转化为唯一的拓扑网络进行记录", "C": "由于计算复杂且随投影变换发生改变，一般不明确描述和表达", "D": "将距离远近函数作为其计算基础"}, "correctAnswer": "C", "explanation": "A项错误，这种计算极其复杂，尚没有很好的解决方法。B项错误，顺序和拓扑并非一回事。C项正确，由于计算复杂，且顺序空间关系会随空间数据的投影及几何变换而发生变化，所以现在的GIS中一般不对其进行描述和表达。D项错误，距离远近属于度量空间关系的范畴。"}]}, {"id": "chapter-4", "title": "第四章：空间数据结构", "description": "矢量结构、栅格结构与拓扑编码", "cards": [{"front": "什么是空间数据结构？", "back": "对空间数据逻辑模型描述的数据组织关系和编排方式的具体实现。"}, {"front": "在地理信息系统中，最常用的两类空间数据结构是什么？", "back": "矢量数据结构和栅格数据结构。"}, {"front": "矢量数据结构通过记录_____及其关系来表示地理实体。", "back": "实体坐标"}, {"front": "矢量数据结构按是否明确表示空间关系，可分为实体数据结构和_____。", "back": "拓扑数据结构"}, {"front": "实体数据结构（spaghetti）的主要单位是什么？", "back": "多边形单元。"}, {"front": "实体数据结构的主要缺点之一是相邻多边形的公共边界需要_____，导致数据冗余。", "back": "数字化两遍"}, {"front": "实体数据结构是否包含多边形的邻域信息和拓扑关系？", "back": "不包含。"}, {"front": "拓扑关系是一种对空间结构关系进行明确定义的_____方法。", "back": "数学"}, {"front": "拓扑数据结构的共同特点是：点相互独立，点连成线，线构成_____。", "back": "面"}, {"front": "拓扑数据结构中最重要的特征是什么？", "back": "具有拓扑编辑功能。"}, {"front": "索引式矢量数据结构如何消除相邻多边形边界的数据冗余？", "back": "通过建立多边形与边界线、边界线与点之间的树状索引。 "}, {"front": "在 DIME 编码中，任何一条线段是由_____和相邻多边形来定义的。", "back": "顺序的两点"}, {"front": "链状双重独立编码结构相对于 DIME 的改进是什么？", "back": "将若干直线段合为一个具有多个中间点的弧段（链段）。"}, {"front": "网络数据结构由边、交汇点以及_____组成。", "back": "连通性规则"}, {"front": "网络建模中，强调边与边之间拓扑关系的是哪种网络？", "back": "逻辑网络。"}, {"front": "栅格数据结构中，位置是通过什么来确定的？", "back": "行列号。"}, {"front": "栅格数据结构的显著特点是：属性明显，_____。", "back": "定位隐含"}, {"front": "完全栅格数据组织的三个基本方式是：基于像元、基于层和_____。", "back": "基于面域"}, {"front": "游程长度编码（Run-length encoding）压缩数据的原理是什么？", "back": "记录相同属性值及其重复的个数（行程）。"}, {"front": "游程长度编码压缩效率最高的情况是_____。", "back": "原始栅格类型越简单（类型面积较大）"}, {"front": "四叉树数据结构的基本思想是将图像等分为哪四个子象限？", "back": "左上 (NW)、右上 (NE)、左下 (SW)、右下 (SE)。"}, {"front": "为了保证四叉树能不断分解，要求栅格单元数必须满足什么条件？", "back": "$2^n \\times 2^n$ ($n$ 为分割次数)。"}, {"front": "线性四叉树叶结点的十进制地址码通常称为什么？", "back": "Morton 码（简称 MD 码）。"}, {"front": "MD 码是通过对栅格单元的_____进行二进制“位”交叉运算得到的。", "back": "行列号"}, {"front": "链码（Freeman 码）通常用于对什么进行编码？", "back": "栅格中的线或多边形边界。"}, {"front": "在链码结构中，每个后续点可能位于前继点的几个基本方向之一？", "back": "8 个。"}, {"front": "影像金字塔结构中，哪一层存储分辨率最高的数据？", "back": "金字塔的底层。"}, {"front": "在电子地图服务中，金字塔结构主要用于组织什么数据？", "back": "地图切片（Tile）。"}, {"front": "矢量数据结构的缺点之一是空间分析技术（如叠置分析）比较_____。", "back": "复杂"}, {"front": "为什么栅格数据结构比较容易和遥感相结合？", "back": "因为遥感影像本身就是以像元为单位的栅格结构。"}, {"front": "矢量数据结构具有“位置明显、_____”的特点。", "back": "属性隐含"}, {"front": "栅格数据若要提高一倍表达精度，数据量会增加几倍？", "back": "3 倍。"}, {"front": "矢栅一体化数据结构的设计基础是什么？", "back": "多级格网方法、三个基本约定和线性四叉树编码。"}, {"front": "矢栅一体化结构中的三级格网分别是粗格网、基本格网和_____。", "back": "细分格网"}, {"front": "在矢量转栅格时，_____决定了数据的输出精度。", "back": "栅格像元的大小"}, {"front": "多边形面域向栅格转换的过程又称为什么？", "back": "多边形填充。"}, {"front": "列举两种常用的多边形填充算法。", "back": "扫描线法、射线法（或内部点扩散法）。"}, {"front": "栅格向矢量转换前，若线画宽度占据多个栅格，需要进行什么处理？", "back": "细化处理。"}, {"front": "Voronoi 单元（泰森多边形）是通过样点之间的什么线生成的？", "back": "垂直平分线。"}, {"front": "TIN（不规则三角网）数据结构通常有以三角形为对象和_____为对象两种组织方式。", "back": "以特征点"}, {"front": "以三角形为基本对象的 TIN 数据结构中，每个三角形记录通常包含哪些拓扑信息？", "back": "三角形顶点 ID 和邻接三角形 ID。"}, {"front": "为什么以特征点为对象的 TIN 结构适合线性内插分析？", "back": "因为它记录了点与点之间的相连关系（三角形边）。"}, {"front": "拓扑数据结构中，线段的左右多边形信息用于确定实体的_____关系。", "back": "邻接"}, {"front": "在栅格游程长度编码中，数据对 $(s_i, l_i)$ 的 $s_i$ 代表什么？", "back": "属性值。"}, {"front": "四叉树自上而下分割法的主要缺点是什么？", "back": "运算量大，因为需要重复检查格网属性值。"}, {"front": "网络数据结构中，用于存储节点空间位置的文件称为什么？", "back": "节点文件。"}, {"front": "在 GIS 应用中，污染扩散模拟通常采用哪种数据结构？", "back": "栅格数据结构。"}, {"front": "在 GIS 应用中，规划选址和路径分析通常采用哪种数据结构？", "back": "矢量数据结构。"}, {"front": "拓扑数据结构中的“弧段”是指始于起始结点、止于终止结点的_____。", "back": "有向曲线"}, {"front": "栅格数据结构中，线状地物在每个栅格单元中最多有多少个相邻同类单元？", "back": "2 个。"}, {"front": "二维行程编码是在生成线性四叉树后，通过合并什么来进一步压缩数据的？", "back": "前后属性值相同的叶结点。"}, {"front": "在矢量转栅格的点要素转换中，“众数原则”指的是什么？", "back": "取落入像元中出现频率最高的属性值作为像元值。"}, {"front": "矢栅一体化结构中，表示基本栅格内局部编码的 Morton 码符号是什么？", "back": "$M_2$。"}, {"front": "Freeman 链码起始点的寻找通常遵循什么原则？", "back": "从上到下、从左到右。"}, {"front": "如果多边形中含有“洞”，在链状双重独立编码的多边形文件中如何记录？", "back": "该“洞”的面积为负，且组成的弧段号前冠以负号。"}, {"front": "哪种矢量结构特别适用于城市地籍宗地的管理？", "back": "DIME（双重独立编码结构）。"}, {"front": "栅格数据结构数学模拟方便的优点对应的代价是什么？", "back": "数据量大、难以建立拓扑关系。"}, {"front": "影像金字塔中，层数增加对应数据分辨率如何变化？", "back": "分辨率依次降低（或变粗）。"}, {"front": "在建立拓扑结构时，若数字化弧段在同一结点坐标偏差过大，应如何处理？", "back": "需要重新数字化该弧段。"}], "exercises": [{"question": "关于空间数据结构的核心作用与本质，下列说法最准确的是？", "options": {"A": "它是对空间数据物理模型进行逻辑抽象的结果。", "B": "它是地理信息系统中沟通信息的桥梁，是数据逻辑模型落到物理组织方式上的实现层。", "C": "空间数据结构仅仅影响数据的存储，不影响数据查询和分析的效率。", "D": "对于同一种空间数据逻辑模型，只能采用唯一的空间数据结构来实现。"}, "correctAnswer": "B", "explanation": "A项空间数据结构是对空间数据逻辑模型描述的数据组织关系和编排方式的具体实现，而非从物理到逻辑的抽象。 B项空间数据结构是地理信息系统沟通信息的桥梁，本质上是逻辑模型落到物理组织方式上的实现层。 C项空间数据结构对地理信息系统中数据存储、查询检索和应用分析等操作处理的效率有着至关重要的影响。 D项同一空间数据逻辑模型往往采用多种具体的空间数据结构，例如栅格数据模型可用游程长度编码或四叉树等多种结构实现。"}, {"question": "以下关于矢量数据结构基本特点的描述中，错误的是？", "options": {"A": "它通过记录实体坐标及其相互关系来组织地理实体，坐标空间是连续的。", "B": "矢量数据结构具有“属性明显、位置隐含”的特点。", "C": "传统做法是将几何图形按文件组织，属性数据采用关系型表记录并以标识符连接。", "D": "该结构数据精度高、存储冗余较小，在计算长度、面积和形状等方面具有极高的效率。"}, "correctAnswer": "B", "explanation": "A项矢量数据结构记录实体坐标，坐标空间为连续空间，这是其准确特点。 B项矢量数据结构具有“位置明显、属性隐含”的特点，而“属性明显、位置隐含”是栅格数据的特征。 C项矢量数据的传统方法正是将几何图形及其关系用文件组织，属性数据采用关系型表记录并靠标识符连接。 D项矢量数据结构精度高、数据量小，这种几何与属性分离相连的特点使其在面积、形状计算等操作中效率很高。"}, {"question": "采用实体数据结构（Spaghetti 数据结构）组织空间数据时，存在的主要缺点是？", "options": {"A": "数字化操作过程极其复杂，编码困难。", "B": "无法用多边形为单元进行组织边界。", "C": "相邻多边形的公共边界通常要数字化两遍，易造成数据冗余并可能产生缝隙或重叠。", "D": "岛状地物会自动与外部多边形建立复杂的拓扑联系。"}, "correctAnswer": "C", "explanation": "A项实体数据结构具有编码容易、数字化操作简单和数据编排直观等优点。 B项实体数据结构正是以多边形为基本单元进行组织，通过记录多边形边界的坐标来表达。 C项由于相邻多边形的公共边界要数字化两遍，从而造成数据冗余存储，且可能导致输出的公共边界出现间隙或重叠。 D项实体数据结构中，岛只作为一个单个图形，并没有建立与外界多边形的联系。"}, {"question": "拓扑数据结构在地理信息系统中至关重要，其最重要的特征是？", "options": {"A": "各个点坐标完全依附于面实体，不能单独存在。", "B": "具有拓扑编辑功能，可对原始数据进行差错编辑并自动形成封闭多边形。", "C": "不需要记录边界的起始结点和终止结点。", "D": "采用矩阵方式排列空间实体。"}, "correctAnswer": "B", "explanation": "A项拓扑数据结构的共同特点是点相互独立，点连成线，线构成面，点并非完全依附于面。 B项拓扑数据结构最重要的特征是具有拓扑编辑功能，不但能对数字化原始数据进行自动差错，而且可自动形成封闭边界。 C项拓扑结构中明确要求每条线都具有始于起始结点、止于终止结点的特征。 D项采用矩阵方式排列是栅格数据结构的特点，而非矢量拓扑结构的特征。"}, {"question": "在索引式拓扑数据结构中，为了减少数据冗余并间接增加邻域信息，采用了什么样的结构？", "options": {"A": "网状索引结构", "B": "四叉树索引结构", "C": "树状索引结构", "D": "线性链表索引结构"}, "correctAnswer": "C", "explanation": "A项索引式结构采用的不是网状索引，而是由点、线、面关系构成的树状索引。 B项四叉树结构主要用于栅格数据的压缩，与这里的矢量索引结构无关。 C项索引式数据结构采用树状索引以减少数据冗余并间接增加邻域信息。 D项该结构是由点索引与边界联系、线索引与多边形联系形成的树状结构，不是简单的线性链表。"}, {"question": "双重独立编码结构（DIME）以哪类要素为编码主体，特别适合应用于哪类系统？", "options": {"A": "以面为编码主体，适合森林资源管理系统", "B": "以点为编码主体，适合气象监测系统", "C": "以城市街道为编码主体，最适合城市信息系统", "D": "以水系为编码主体，适合水文网络系统"}, "correctAnswer": "C", "explanation": "A项DIME并非以面为编码主体，而是以线段（街道）为中心。 B项DIME强调的是线段以及左右多边形的关系，并非以纯点为主体。 C项DIME最早由美国人口统计系统采用，以城市街道为编码主体，特别适合城市信息系统与地籍管理。 D项虽然可用于网络，但DIME主要针对的是有左右多边形拓扑的网状或面状系统（如街道、宗地），非专门水系设计。"}, {"question": "链状双重独立编码结构相对于传统 DIME 数据结构的主要改进在于？", "options": {"A": "抛弃了拓扑关系，采用纯实体的存储方式。", "B": "将若干直线段合为一个弧段（链段），每个弧段可以包含许多中间点。", "C": "不再记录左右多边形的邻接关系。", "D": "用单一网格编码代替结点坐标。"}, "correctAnswer": "B", "explanation": "A项链状双重独立结构依然是拓扑数据结构，没有抛弃拓扑关系。 B项DIME中一条边只能表示两端点间的直线，而链状结构将其改进为一个可含大量中间点的弧段（链段）。 C项弧段文件仍需存储起止结点号以及左右多边形号以维持拓扑。 D项用网格编码代替坐标是矢栅一体化结构的特征，与链状DIME无关。"}, {"question": "在复杂网络数据结构中，为了进行连通性分析，除了节点文件和边文件外，通常还必需添加什么文件？", "options": {"A": "属性权重文件", "B": "面域坐标文件", "C": "节点-边关系数据文件", "D": "栅格网格索引文件"}, "correctAnswer": "C", "explanation": "A项网络分析中虽需权重属性，但连通性分析在结构层面最依赖的是拓扑关系描述。 B项网络主要由点和线组成，连通性不需要单独的面域坐标文件来支撑。 C项虽然通过节点和边文件能画出图形，但无法确定网络连通的拓扑关系，必须添加节点-边关系文件。 D项网络数据属于矢量或独立拓扑结构，不需要栅格的网格索引文件来维持连通性。"}, {"question": "关于栅格数据结构的显著特点，表述正确的是？", "options": {"A": "位置明显，属性隐含，通过坐标显式定位。", "B": "能精确表达任意位置、长度和面积的连续实体。", "C": "属性明显，定位隐含，依靠行列号转换为坐标实现定位。", "D": "修改分辨率减小数据量时，不会损失精度和信息量。"}, "correctAnswer": "C", "explanation": "A项这是矢量数据的特征，栅格数据具有“属性明显，定位隐含”的特点。 B项栅格数据表示的地表是不连续的，是量化和近似离散的数据，矢量才能任意精确定义连续实体。 C项栅格数据直接记录属性值，其位置根据在数据集中的行列号转换得出，即属性明显、定位隐含。 D项栅格数据通过改变分辨率来减少数据量时，精度和信息量会同时受损。"}, {"question": "完全栅格数据结构的“基于像元”组织方式具有什么特点？", "options": {"A": "坐标存储浪费极大，每个图层均要存储一遍同名坐标。", "B": "将同一个面上所有栅格坐标统一记录一次，便于边界提取。", "C": "节省了各图层对应坐标重复存储的空间，且便于数据扩充和修改。", "D": "在各行数据变化时才记录数据对，具有较高压缩比。"}, "correctAnswer": "C", "explanation": "A项坐标浪费大是“基于层”组织的缺点，“基于像元”方式各层对应坐标只需存储一次。 B项这是“基于面域”组织方式的特征，并非基于像元的特征。 C项基于像元是以像元为单位记录坐标及各层属性，节省了多层存储坐标的空间，简单明了，便于扩充修改。 D项这是游程长度编码的特点，完全栅格结构不采用任何压缩处理。"}, {"question": "游程长度（行程）编码在何种情况下具有最高的压缩效率？", "options": {"A": "当地物类型极其分散、属性连续频繁变化时。", "B": "原始栅格类型越简单，即相邻大量像元具有相同属性时。", "C": "当栅格图像尺寸不足 2^n × 2^n 时。", "D": "当每个栅格单元都必须被重新加密拆分时。"}, "correctAnswer": "B", "explanation": "A项压缩比与图的复杂程度成反比，变化多、类型分散的部分游程数就多，压缩效率低。 B项游程编码在相邻点有相同代码时进行压缩，原始分类越简单连续，游程越长，压缩效率就越高。 C项尺寸必须为2的幂是四叉树结构的要求，与游程编码无关。 D项虽然游程编码在栅格加密时数据量不明显增加，但其高效率根本源于像元属性的一致性而非加密操作本身。"}, {"question": "在建立四叉树数据结构时，不断进行四等分分割的终止条件是？", "options": {"A": "分割直到每个子区内的栅格数量为 16 个为止。", "B": "分割直到每个子块都只含有相同的属性值或达到最小不可再分单元为止。", "C": "分割直到所有子区的边界形成闭合多边形为止。", "D": "分割直到背景被零填满为止。"}, "correctAnswer": "B", "explanation": "A项四叉树不是以剩余像元数固定为16作为终止条件，而是看内部属性是否一致。 B项四叉树的基本思想是逐块检查，如果子块内部都含相同属性值则停止细分，直到每个块内部同质或达到最小像素。 C项这是边界表示或矢量转换的特点，与四叉树基于属性均质性的分割原则不符。 D项对于非标准图像是用0补足背景以便建树，但这并不是分割过程的停止判断条件。"}, {"question": "线性四叉树相比于常规四叉树的主要优势是？", "options": {"A": "保留了所有的父节点指针以便于层级回溯。", "B": "它只存贮最后叶结点的信息（含地址码和属性），大大节省了中间指针的存储量。", "C": "必须采用从下而上的递归合并法构建。", "D": "它只能处理彩色遥感图像，不能处理分类专题图。"}, "correctAnswer": "B", "explanation": "A项常规四叉树才保留记录父结点指针，线性四叉树省去了这些中间结点与指针。 B项线性四叉树只存贮最后叶结点的位置、深度和属性，依靠地址码（如Morton码）隐含位置信息，减小了存储量。 C项无论哪种四叉树都可以采用自上而下或自下而上建立，这并非线性四叉树独有的优势或限制。 D项线性四叉树是一种通用的数据压缩编码，既可处理图像也可处理各种分类专题栅格数据。"}, {"question": "计算十进制 Morton 码（MD 码）的常用机制是？", "options": {"A": "将行号和列号的十进制数直接相乘得出。", "B": "沿顺时针方向依次将四周像素的值相加。", "C": "将十进制的行号和列号转换成二进制数后，进行“位”的交叉组合，再转换为十进制。", "D": "通过求同一层级中所有相邻格网的平均值产生。"}, "correctAnswer": "C", "explanation": "A项Morton码不是通过行列的十进制直接乘积运算生成的。 B项顺时针方向搜索是链码或某些拓扑追踪的方法，与Morton码的“位”操作无关。 C项根据算法，需先将行列号转为二进制数，并两两交叉错位产生新的二进制数，再转化为十进制得出MD码。 D项平均值计算适用于栅格重采样降尺度，与产生Morton地址码无关。"}, {"question": "二维行程编码结构的实质是？", "options": {"A": "对原始栅格逐行扫描进行一维的游程压缩。", "B": "把常规游程编码直接应用到矢量数据上。", "C": "在线性四叉树生成后，进一步将前后地址码相邻且属性值相同的叶结点合并。", "D": "彻底抛弃了 Morton 码排序，重新生成随机列表。"}, "correctAnswer": "C", "explanation": "A项逐行扫描并压缩是传统的一维游程长度编码，不是二维行程编码。 B项二维行程编码仍是针对栅格数据的压缩方式，未应用到矢量数据。 C项它在线性四叉树表列的基础上，对按 Morton 码排序后相邻且属性值相同的叶结点进行再次合并，进一步压缩了数据。 D项它严格采用了线性四叉树的地址码（Morton 码）的顺序进行编码，而非随机列表。"}, {"question": "采用 Freeman 码的链码数据结构具有什么明显的缺点？", "options": {"A": "无法记录对象的起始点和方向链。", "B": "对计算面积、长度和凹凸度极为不便。", "C": "没有区域性质，对边界的合并、插入等修改编辑十分困难，不适于复杂的区域空间分析。", "D": "会造成大量的空白冗余存储，压缩效率最低。"}, "correctAnswer": "C", "explanation": "A项链式编码恰恰是由起始点和单位矢量链组成，清晰记录了起点和方向。 B项链码结构对计算面积、长度、转折方向等几何特征实际上是十分方便的。 C项由于链码结构不具有区域填充性质，对其进行边界编辑修改困难，也不便于执行区域性的空间分析运算。 D项链码能将线状与边界数据大幅度压缩为少量链码串，不存在大量空白冗余的问题。"}, {"question": "在影像与瓦片金字塔数据结构中，各层级分辨率的分布规律是？", "options": {"A": "金字塔的最顶层存储最高分辨率数据，底层存储最低分辨率数据。", "B": "所有层级的分辨率完全相同，只改变每张切片覆盖的面积。", "C": "金字塔最顶层存储最低分辨率、数据量最小的影像；到底层则存储分辨率最高、数据量最大的影像。", "D": "切片的层级数量不影响数据的总体压缩比例。"}, "correctAnswer": "C", "explanation": "A项顶层应该存放最低分辨率的数据，底层才是最高分辨率数据。 B项金字塔的不同层级代表着由粗到细的不同分辨率阶段，分辨率随层级改变。 C项最顶层数据量小、分辨率低；随着层数往下，数据分辨率逐步变细，直到满足底层高清需求。 D项金字塔本身是为了有损压缩和快显，层级的设置与压缩传输效率密切相关。"}, {"question": "现代互联网地图使用瓦片（切片）金字塔的主要作用是？", "options": {"A": "提升矢量拓扑检查的速度。", "B": "使不同显示比例尺等级下的用户请求都能看到固定大小但具有相同清晰分辨率的地图切片，提升传输效率。", "C": "使得遥感影像能够被彻底转化为纯矢量数据。", "D": "对不规则镶嵌模型（如 TIN）进行重新划分。"}, "correctAnswer": "B", "explanation": "A项切片主要用于数据组织、传输和快速显示，与矢量拓扑检查速度无关。 B项互联网地图将数据组织为多级切片，确保放大缩小时加载的总是对应级别的清晰小图块，避免直接传输大文件。 C项瓦片机制不仅适用于影像，也适用于电子地图切图，但并不涉及栅格与矢量的实质性数据格式转换。 D项瓦片金字塔常用于按规则四等分进行组织的影像和地图，与 TIN 不规则镶嵌无关。"}, {"question": "相对于栅格数据结构，传统矢量数据结构在应用中存在的一个主要缺点是？", "options": {"A": "图形绘制和输出极其粗糙。", "B": "数据存储量极其庞大，存在巨大的数据冗余。", "C": "数学模拟较为困难，且在执行叠置分析等操作时算法处理非常复杂。", "D": "极难建立和管理空间网络拓扑关系。"}, "correctAnswer": "C", "explanation": "A项矢量数据具有“图形显示质量好、精度高、输出美观”的优点。 B项矢量数据的特点就是数据结构严密，冗余度小，数据量相对较小。 C项由于矢量坐标的复杂性，它在处理图层叠置分析和连续场数学模拟时，相较于栅格矩阵要复杂得多。 D项矢量数据极易构建网络拓扑关系，相反，栅格结构难以建立网络连接关系。"}, {"question": "在矢栅一体化数据结构中，通过多级格网来实现数据的空间定位。其中 M0、M1、M2 的具体作用是？", "options": {"A": "分别代表三种不同颜色的属性编码。", "B": "M0、M1 表示研究区整体的粗格网和基本格网 Morton 码，M2 表示基本栅格内的细分格网局部 Morton 码。", "C": "M0 代表点实体，M1 代表线实体，M2 代表面实体。", "D": "M0、M1、M2 是矢量数据的平面直角坐标系的分量。"}, "correctAnswer": "B", "explanation": "A项M 码（Morton码）用于表示空间空间格网索引位置，而非颜色属性编码。 B项M0 对应粗格网整体编码，M1 对应基本格网整体编码，M2 对应为提高分辨率细分的局部格网编码，以此构建多级结构。 C项点、线、面实体都需使用多级格网组合（如M1, M2序列）来描述其定位或填充，并不分别对应单一的 M 层。 D项M 码是基于栅格四叉树思想生成的地址索引，是用来“代替”矢量直角坐标的，而非直角坐标分量。"}, {"question": "矢栅一体化数据结构为赋予栅格结构矢量特性，对空间对象做出了三个约定，下列哪个不属于这三个约定？", "options": {"A": "点状地物仅有空间位置而无形状和面积，计算机中仅保留一个坐标数据（M1, M2）。", "B": "线状地物有形状但无面积，用一组填满栅格元子的路径来表达。", "C": "面状地物有形状和面积，由元子表达边界线以及内部被填满的区域组成。", "D": "所有地物的拓扑关系都必须用 Spaghetti 链表单独重写。"}, "correctAnswer": "D", "explanation": "A项约定之一确实是点实体只记录位置（转换后的格网坐标）。 B项约定之二定义线状地物用一组格网元子填充的路径表示。 C项约定之三定义面状地物除了边界线外，还要用内部被填满的元子区域表达。 D项矢栅一体化自带网格拓扑特性，通过记录穿过网格边界的指针维持关系，并非使用非拓扑的 Spaghetti 重写。"}, {"question": "在矢量点数据向栅格数据结构转换时，如果多个点对象落入同一个目标栅格像元中，通常如何处理其像元值？", "options": {"A": "强制丢弃所有点对象，将像元设为无数据（NoData）。", "B": "必须采用所有要素属性值的最小值赋给该栅格。", "C": "可以根据实际需要采用值总和、平均值、最大值、最小值或众数等不同的赋值原则进行计算。", "D": "自动对栅格单元进行四叉树分裂直到每一个像元只包含一个点。"}, "correctAnswer": "C", "explanation": "A项丢弃数据是不合理的，系统提供了多种冲突解决机制以保留信息。 B项取最小值只是一种可选原则，并非唯一的“必须”准则。 C项矢转栅时，多个点落入同一单元的情况，通常可按总和、平均值、极值、众数等统计规则计算出最终的像元值。 D项栅格分辨率（像元大小）在转换前已固定好，一般不会在转换运算中途自动进行动态四叉树分裂。"}, {"question": "矢量多边形向栅格转换（即多边形栅格化）的核心操作是首先栅格化边界线段，然后用属性值填充面域内部。下列哪种算法不是常用的多边形填充算法？", "options": {"A": "内部点扩散法", "B": "射线法", "C": "扫描线法", "D": "样条函数插值法"}, "correctAnswer": "D", "explanation": "A项内部点扩散（如泛洪填充）是经典的面域栅格化填充算法。 B项射线法能判断格网点是否在面域内，是常用的填充判断算法。 C项扫描线法通过水平线与边界交点来判定并填充内部栅格，极为常用。 D项样条函数插值法用于栅格转矢量后的曲线圆滑去锯齿操作，不是用于多边形栅格填充。"}, {"question": "将图幅从自动扫描仪获取的栅格数据转换为矢量数据时，通常需要经历一系列复杂处理。下列哪个步骤属于正常的栅格转矢量处理流程？", "options": {"A": "降低原图分辨率以掩盖数字化误差。", "B": "将彩色影像直接转为带有三维拓扑的网状结构。", "C": "经过二值化、细化处理，顺时针或逆时针根据8邻域搜索跟踪线段，生成拓扑并去除多余点。", "D": "对线画图应用内部点扩散法进行内部填充。"}, "correctAnswer": "C", "explanation": "A项降分辨率会进一步损失图形质量，正确做法应是在原有提取基础上细化和拟合。 B项栅格转矢量前需要提取边界和二值化，且不是直接产生三维网状结构。 C项标准的栅格转矢量过程包括边界提取/细化成二值图，通过8邻域搜索跟踪，坐标转换，建立拓扑，最后去冗余与圆滑。 D项内部点扩散法是将矢量面转为栅格时用的填充算法，方向恰好相反。"}, {"question": "由于栅格精度限制，栅格数据矢量化生成的追踪曲线往往不够圆滑，存在锯齿。下列用于曲线圆滑（插补平滑处理）的算法是？", "options": {"A": "分段三次多项式插值法与样条函数插值法。", "B": "游程长度编码算法。", "C": "DIME 拓扑建网法。", "D": "粗格网与基本格网融合法。"}, "correctAnswer": "A", "explanation": "A项为了平滑去锯齿，常用线性迭代、分段三次多项式插值、样条函数插值法等。 B项游程长度编码是栅格数据的无损压缩结构算法。 C项DIME 是建立网络或多边形拓扑数据结构的方式，无插值圆滑功能。 D项粗细格网融合是矢栅一体化数据组织的机制。"}, {"question": "以 Voronoi 单元为核心组织不规则镶嵌数据时，其结构的显著特点包括？", "options": {"A": "用正方形或矩形单元进行平面的规则划分。", "B": "相邻 Voronoi 单元的边界定义为相邻样点连线的垂直平分线，数据表统一按逆时针记录相邻关系。", "C": "只记录顶点坐标，不需要建立样点ID、单元顶点组成的映射。", "D": "它本质上等同于完全栅格数据结构的基于像元方式。"}, "correctAnswer": "B", "explanation": "A项Voronoi 是不规则多边形面块，规则正方形单元属于普通栅格模型。 B项Voronoi图依据相邻节点连线的垂直平分线生成边界，并以逆时针记录单元邻接与顶点组成以支持空间面域分析。 C项结构中包含详尽的样点记录、邻接表、顶点坐标及单元-顶点组成表，联系十分紧密。 D项它是基于矢量坐标和多边形边界构筑的不规则镶嵌拓扑结构，与逐个格网的完全栅格完全不同。"}, {"question": "TIN 三角网可以使用两种不同的核心对象建立拓扑。若以“特征结点”为基本空间对象组织 TIN 数据结构，其文件的主要特征是？", "options": {"A": "每个三角形记录一条包含三个顶点的长链。", "B": "通过正方形栅格来替代特征点位置。", "C": "顶点文件中增加了指针，利用另一索引文件按顺时针指向与该点相连接的所有其余特征点。", "D": "自动省略所有的边界连线。"}, "correctAnswer": "C", "explanation": "A项这是以“三角形”为基本对象组织时的表现形式。 B项TIN 是矢量的不规则三角网，不使用正方形栅格替代点。 C项以结点为核心的TIN结构，使用顶点附加指针，指向顺时针排列的相邻点连线索引表，极适合边和点的连接推理（如插值）。 D项TIN通过点或三角形建立完整的全覆盖连接，边界连线必不可少。"}, {"question": "时空数据模型与三维数据模型（X, Y, Z）虽然在多维表示形式上有类似之处，但两者存在本质上的逻辑与分析差异，其根本原因是？", "options": {"A": "三维数据通常存储为矢量，而时空数据只能存储为游程编码栅格。", "B": "三维数据模型的三个维度都只能表示离散数据，时空模型只能表示连续场。", "C": "三维空间中三个维度的度量尺度和单位是一致的（均表示空间距离），而时空模型中 T 轴的度量单位是特定的时间长度，与其他两轴尺度不一致。", "D": "时空数据模型只需要在文件头部加入一个统一时间戳即可，不需要 T 轴。"}, "correctAnswer": "C", "explanation": "A项两者既可以用离散对象表达，也可以用连续场等多种结构表达，存储方式不局限。 B项两种模型都既包含离散数据形式也包含连续形式。 C项这是导致二者分析范式和算法不同的根源，T 轴代表的是时间维，其度量衡与代表空间距离的 XY(Z) 轴截然不同。 D项要对动态变化进行分析建模，T 作为独立维度深度参与内部结构划分，不仅是单一头部属性。"}, {"question": "八叉树数据结构在处理三维空间物体时，其主要优点之一是？", "options": {"A": "由于彻底清除了树状层级结构，节省了极大的指针空间。", "B": "它强制将空间分割为 10 等分，具有更高的表达精度。", "C": "只能应用于没有内部属性变化的空间物体。", "D": "非常方便实现空间对象的并、交、差等集合运算，并有助于消除隐线和隐面。"}, "correctAnswer": "D", "explanation": "A项八叉树依靠逐级划分的层级结构组织，并未清除树状层级。 B项顾名思义并依定义，八叉树是将三维空间沿三个方向从中间八等分。 C项八叉树正是用来刻画三维内部属性随空间变化分布的体素模型。 D项基于八叉树规则严谨的有序性和分层性，集合运算极其方便，也有助于三维显示的隐面消除平衡。"}, {"question": "采用三维边界表示法来描述三维平面多面体时，为了更充分地表达拓扑关系以用“空间换取时间”，通常会对基础数据表进行什么扩充？", "options": {"A": "将多面体投影为二维 DIME 文件。", "B": "在边表或面表中加入所属相邻多边形的信息（如指出某条边是否为两个多边形公共边），以便快速检索。", "C": "利用游程长度对三维多面体的顶点坐标进行压缩。", "D": "丢弃顶点表，只保留纯面表文件。"}, "correctAnswer": "B", "explanation": "A项二维 DIME 是平面网状编码，不涉及三维表面多面体的空间换时间扩充。 B项在边表中补充指出它是由哪两个多边形共享的公共边，避免在查询时重复计算，极大地提高了面与面相邻拓扑关系的处理效率。 C项游程编码用于栅格矩阵压缩，不适用于基于点、边、面的矢量三维边界表示法。 D项三维边界表示法的核心是避免点、边、面的重复，省略顶点表将导致公共顶点坐标被反复多次重复记录，背离其初衷。"}]}];
function renderMathIn(element){if(window.renderMathInElement){window.renderMathInElement(element,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}}
const state = { chapter: chapters[0], cardIndex: 0, right: 0, wrong: 0, exerciseChapter: chapters[0], exerciseIndex: 0, flipped: false };
let favorites = JSON.parse(localStorage.getItem('gis-static-favorites') || '{"cards":[],"exercises":[]}');
const $ = s => document.querySelector(s);
function saveFav(){localStorage.setItem('gis-static-favorites', JSON.stringify(favorites));}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='favorites') renderFavorites();}
function renderChapters(){const exerciseChapters=chapters.filter(c=>Array.isArray(c.exercises)&&c.exercises.length>0);$('#chapterList').innerHTML=chapters.map(c=>`<button class="chapter-card" data-chapter="${c.id}"><span><span class="chapter-name">${c.title}</span><span class="chapter-meta">${c.description} · ${c.cards.length} 张卡片</span></span><span class="chapter-arrow">›</span></button>`).join('');$('#exerciseList').innerHTML=exerciseChapters.map(c=>`<button class="chapter-card" data-exercise-chapter="${c.id}"><span><span class="chapter-name">${c.title}</span><span class="chapter-meta">${c.description} · ${c.exercises.length} 道题</span></span><span class="chapter-arrow">›</span></button>`).join('')||'<div class="empty">暂时还没有可用的练习题。</div>';}
function updateCardSide(){const item=state.chapter.cards[state.cardIndex];$('#cardText').textContent=state.flipped?item.back:item.front;$('#cardText').className=state.flipped?'a':'q';renderMathIn($('#cardText'));$('#cardHint').textContent=state.flipped?'选择掌握情况':'查看答案';$('#card').classList.toggle('answer-side',state.flipped);}function renderCard(){const c=state.chapter;state.flipped=false;$('#studyTitle').textContent=c.title;$('#counterF').textContent=`${state.cardIndex+1} / ${c.cards.length}`;$('#bar').style.width=`${(state.cardIndex+1)/c.cards.length*100}%`;updateCardSide();$('#studyActions').classList.remove('hidden');$('#afterActions').className='actions hidden';$('#favCard').style.display='';}
function mark(ok){if(!state.flipped){state.flipped=true;updateCardSide();return;} ok?state.right++:state.wrong++;$('#rightN').textContent=state.right;$('#wrongN').textContent=state.wrong;$('#studyActions').classList.add('hidden');$('#afterActions').classList.remove('hidden');$('#afterActions').classList.toggle('one',ok);$('#favCard').style.display=ok?'none':'';}
function nextCard(){state.cardIndex=(state.cardIndex+1)%state.chapter.cards.length;renderCard();}
function favoriteCard(){const key=`${state.chapter.id}:${state.cardIndex}`;if(!favorites.cards.includes(key))favorites.cards.push(key);saveFav();$('#favCard').textContent='已收藏';}
function renderExercise(){const c=state.exerciseChapter;if(!c||!Array.isArray(c.exercises)||c.exercises.length===0){$('#exerciseTitle').textContent=c?.title||'练习';$('#exerciseCounter').textContent='';$('#exerciseQuestion').textContent='本章节暂时还没有练习题。';$('#exerciseOptions').innerHTML='';$('#explain').classList.remove('active');$('#explain').textContent='';$('#exerciseActions').className='actions hidden';renderMathIn($('#exerciseQuestion'));return;}const item=c.exercises[state.exerciseIndex];$('#exerciseTitle').textContent=c.title;$('#exerciseCounter').textContent=`${state.exerciseIndex+1} / ${c.exercises.length}`;$('#exerciseQuestion').textContent=item.question;renderMathIn($('#exerciseQuestion'));$('#explain').classList.remove('active');$('#explain').textContent='';$('#exerciseActions').className='actions hidden';$('#favExercise').style.display='';$('#favExercise').textContent='收藏';$('#exerciseOptions').innerHTML=Object.entries(item.options).map(([k,v])=>`<button class="option" data-option="${k}"><strong>${k}.</strong> ${v}</button>`).join('');renderMathIn($('#exerciseOptions'));}
function chooseOption(opt){const item=state.exerciseChapter.exercises[state.exerciseIndex], ok=opt===item.correctAnswer;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.option===item.correctAnswer)b.classList.add('correct');if(b.dataset.option===opt&&!ok)b.classList.add('incorrect');});$('#explain').textContent=`正确答案：${item.correctAnswer}。${item.explanation}`;renderMathIn($('#explain'));$('#explain').classList.add('active');$('#exerciseActions').classList.remove('hidden');$('#exerciseActions').classList.toggle('one',ok);$('#favExercise').style.display=ok?'none':'';}
function nextExercise(){state.exerciseIndex=(state.exerciseIndex+1)%state.exerciseChapter.exercises.length;renderExercise();}
function favoriteExercise(){const key=`${state.exerciseChapter.id}:${state.exerciseIndex}`;if(!favorites.exercises.includes(key))favorites.exercises.push(key);saveFav();$('#favExercise').textContent='已收藏';}
function renderFavorites(){const cards=favorites.cards.map(k=>{const [cid,i]=k.split(':'),c=chapters.find(x=>x.id===cid),item=c?.cards[+i];return item?`<article class="fav-card"><p><strong>${c.title} · 卡片 ${+i+1}</strong></p><p>${item.front}</p><p>${item.back}</p></article>`:''}).join('');const ex=favorites.exercises.map(k=>{const [cid,i]=k.split(':'),c=chapters.find(x=>x.id===cid),item=c?.exercises[+i];return item?`<article class="fav-card"><p><strong>${c.title} · 练习 ${+i+1}</strong></p><p>${item.question}</p><p>答案：${item.correctAnswer}。${item.explanation}</p></article>`:''}).join('');$('#favoritesList').innerHTML=cards+ex||'<div class="empty">还没有收藏。</div>';}
document.addEventListener('click',e=>{const s=e.target.closest('[data-screen]')?.dataset.screen;if(s)show(s);const ch=e.target.closest('[data-chapter]')?.dataset.chapter;if(ch){state.chapter=chapters.find(c=>c.id===ch);state.cardIndex=0;renderCard();show('study');}const ech=e.target.closest('[data-exercise-chapter]')?.dataset.exerciseChapter;if(ech){state.exerciseChapter=chapters.find(c=>c.id===ech);state.exerciseIndex=0;renderExercise();show('exercise');}const opt=e.target.closest('[data-option]')?.dataset.option;if(opt)chooseOption(opt);});
$('#card').addEventListener('click',()=>{state.flipped=!state.flipped;updateCardSide();});$('#wrong').onclick=()=>mark(false);$('#right').onclick=()=>mark(true);$('#nextCard').onclick=nextCard;$('#favCard').onclick=favoriteCard;$('#nextExercise').onclick=nextExercise;$('#favExercise').onclick=favoriteExercise;
renderChapters();renderCard();state.exerciseChapter=chapters.find(c=>Array.isArray(c.exercises)&&c.exercises.length>0)||chapters[0];renderExercise();
</script>
</body>
